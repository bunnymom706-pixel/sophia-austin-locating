<?xml version="1.0" encoding="UTF-8"?>
<!--
  Spirit Real Estate Group, LLC — REDRAWN mark.

  This is a vector reconstruction traced from a screenshot of the logo, not the
  brokerage's official artwork. It is close but it is not authoritative: the
  wordmark is set in Montserrat, which approximates the original's geometric
  sans rather than matching it. Replace this file with the official asset
  before a production print run — every card references this one path, so
  dropping the real file in here updates the whole suite at once.

  Second pass against a cleaner copy of the original. Three things were wrong:
  the flame was a rounded droplet with an oval centre, which read as water
  rather than fire; it sat low enough to cover the top of the I, where the
  original clears the cap line and leaves the stem visible; and "REAL ESTATE
  GROUP" ran wider than "SPIRIT" instead of matching it.

  The flame is now drawn with a leaning tip, a shoulder on the left and an
  inner negative tongue that comes to a single point, and it carries the warm
  top-to-bottom gradient the original has. The viewBox extends just above the cap
  line to give it that room — the box stays 620 units wide with a 74-unit cap
  height, so the cap-to-width ratio the TREC sizing depends on is unchanged at
  0.1194; only the rendered image gets taller.

  Colours sampled from the supplied image: navy #0E2C5A, flame #FDB714 to #F5871F.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -26 620 184" width="620" height="184"
     role="img" aria-label="Spirit Real Estate Group, LLC">
  <defs>
    <linearGradient id="flame" x1="0.72" y1="0" x2="0.22" y2="1">
      <stop offset="0" stop-color="#fdb714"/>
      <stop offset="1" stop-color="#f5871f"/>
    </linearGradient>
  </defs>
  <style>
    .wm { font-family: 'Montserrat', 'Poppins', sans-serif; font-weight: 800; font-size: 104px;
          letter-spacing: 6px; fill: #0e2c5a; }
    .sub { font-family: 'Montserrat', 'Poppins', sans-serif; font-weight: 500; font-size: 26px;
           letter-spacing: 5.7px; fill: #0e2c5a; }
  </style>

  <!-- wordmark; the I keeps no tittle because the flame sits above it -->
  <text class="wm" x="310" y="98" text-anchor="middle">SPIRIT</text>

  <!-- flame standing in for the dot of the I: base just breaks the cap line,
       tip reaching about three quarters of the cap height above it -->
  <g transform="translate(388, -24) scale(0.81)">
    <path d="M26 0
             C 26 14, 36 20, 39 30
             C 42 40, 40 50, 34 57
             C 29 64, 23 68, 17 68
             C 8 68, 2 61, 2 51
             C 2 42, 9 37, 13 29
             C 16 23, 17 16, 16 10
             C 20 13, 24 8, 26 0 Z"
          fill="url(#flame)"/>
    <path d="M24 24
             C 25 32, 31 38, 33 45
             C 35 51, 32 58, 27 61
             C 24 63, 20 64, 17 64
             C 12 64, 8 59, 8 53
             C 8 47, 13 43, 16 37
             C 18 33, 20 29, 24 24 Z"
          fill="#ffffff"/>
  </g>

  <text class="sub" x="310" y="152" text-anchor="middle">REAL ESTATE GROUP</text>
</svg>
