<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Marshmallow Pink — Front</title>
<link rel="stylesheet" href="../../assets/fonts/fonts.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1125px; height: 675px; overflow: hidden; background: #ffb8d9; }

  .card {
    position: relative;
    width: 1125px;
    height: 675px;
    overflow: hidden;
    background: #fff1f8;
    font-family: 'Poppins', sans-serif;
  }

  .pattern {
    position: absolute;
    inset: 0;
    background-color: #ffb8d9;
      background-image: radial-gradient(circle at 50% 50%, #fff1f8 30px, rgba(255,241,248,0) 31px);
      background-size: 150px 150px;
      background-position: 0 0;
  }

  .sparkle { position: absolute; }
  .sparkle svg { display: block; }

  .stack {
    position: absolute;
    left: 37.5px; right: 37.5px;
    top: 78px;
    text-align: center;
  }
  .role { margin-top: 10px; }

  .compliance {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    bottom: 62px;
    background: #fff1f8;
    border-radius: 999px;
    padding: 9px 26px;
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.9px;
    color: #a3164e;
    white-space: nowrap;
    box-shadow: 0 0 0 3px #a3164e, 0 5px 0 rgba(0,0,0,0.16);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="pattern"></div>

    <div class="sparkle" style="top:139px; left:927px;">
      <svg width="62" height="62" viewBox="0 0 40 40"><path d="M20 1 C21.6 12 28 18.4 39 20 C28 21.6 21.6 28 20 39 C18.4 28 12 21.6 1 20 C12 18.4 18.4 12 20 1 Z" fill="#fff1f8"/></svg>
    </div>
    <div class="sparkle" style="top:480px; left:142px;">
      <svg width="54" height="54" viewBox="0 0 40 40"><path d="M20 1 C21.6 12 28 18.4 39 20 C28 21.6 21.6 28 20 39 C18.4 28 12 21.6 1 20 C12 18.4 18.4 12 20 1 Z" fill="#fff1f8"/></svg>
    </div>
    <div class="sparkle" style="top:484px; left:820px;">
      <svg width="46" height="46" viewBox="0 0 40 40"><path d="M20 1 C21.6 12 28 18.4 39 20 C28 21.6 21.6 28 20 39 C18.4 28 12 21.6 1 20 C12 18.4 18.4 12 20 1 Z" fill="#fff1f8"/></svg>
    </div>

    <div class="stack">
      <svg width="1050" height="330" viewBox="0 0 1050 330" xmlns="http://www.w3.org/2000/svg">
        <g font-family="Bagel Fat One" font-size="132" text-anchor="middle"
         stroke-linejoin="round" paint-order="stroke">
        <!-- cast shadow -->
        <g stroke="#5c0c2b" stroke-width="32" fill="#5c0c2b" opacity="0.22" transform="translate(6,9)">
          <text x="525" y="128">sophia sky</text>
          <text x="525" y="272">reddehase</text>
        </g>
        <!-- dark keyline: holds the edge over the light squares -->
        <g stroke="#5c0c2b" stroke-width="32" fill="#5c0c2b">
          <text x="525" y="128">sophia sky</text>
          <text x="525" y="272">reddehase</text>
        </g>
        <!-- cream halo: holds the edge over the dark squares -->
        <g stroke="#fff1f8" stroke-width="18.0" fill="#fff1f8">
          <text x="525" y="128">sophia sky</text>
          <text x="525" y="272">reddehase</text>
        </g>
        <g fill="#a3164e">
          <text x="525" y="128">sophia sky</text>
          <text x="525" y="272">reddehase</text>
        </g>
      </g>
      </svg>
      <div class="role">
        <svg width="1050" height="46" viewBox="0 0 1050 46" xmlns="http://www.w3.org/2000/svg">
          <rect x="238.5" y="-2.0" width="566.0" height="61.0" rx="14" fill="#6d0e34" opacity="0.85"/>
      <rect x="238.5" y="-7.0" width="566.0" height="61.0" rx="14" fill="#a3164e"/>
      <text x="525" y="32" text-anchor="middle"
                font-family="Poppins" font-weight="700" font-size="24" letter-spacing="7"
                fill="#fff1f8">TEXAS APARTMENT LOCATOR</text>
        </svg>
      </div>
    </div>

    <div class="compliance">TREC #831516 &nbsp;·&nbsp; SPIRIT REAL ESTATE GROUP, LLC</div>
  </div>
</body>
</html>
