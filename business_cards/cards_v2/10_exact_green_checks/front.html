<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Exact Green Checks — Front</title>
<link rel="stylesheet" href="../../assets/fonts/fonts.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1125px; height: 675px; overflow: hidden; background: #4d6b46; }

  .card {
    position: relative;
    width: 1125px;
    height: 675px;
    overflow: hidden;
    background: #f2ebd9;
  }

  /* full-bleed checkerboard, 140.625px cells = 8 across */
  .checks {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(45deg, #4d6b46 25%, transparent 25%, transparent 75%, #4d6b46 75%),
      linear-gradient(45deg, #4d6b46 25%, transparent 25%, transparent 75%, #4d6b46 75%);
    background-size: 281.25px 281.25px;
    background-position: 0 0, 140.625px 140.625px;
  }

  .type { position: absolute; inset: 0; }
  .compliance {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    bottom: 56px;
    background: #f2ebd9;
    border-radius: 999px;
    padding: 9px 26px;
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.9px;
    color: #33492e;
    white-space: nowrap;
    box-shadow: 0 0 0 3px #33492e, 0 5px 0 rgba(0,0,0,0.16);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="checks"></div>

    <svg class="type" width="1125" height="675" viewBox="0 0 1125 675" xmlns="http://www.w3.org/2000/svg">
      <!-- name, cream-outlined so it reads over either check colour -->
      <g font-family="Bagel Fat One" font-size="136" text-anchor="middle"
         stroke-linejoin="round" paint-order="stroke">
        <!-- cast shadow -->
        <g stroke="#42182f" stroke-width="33" fill="#42182f" opacity="0.22" transform="translate(6,9)">
        <text x="562" y="288">sophia sky</text>
        <text x="562" y="434">reddehase</text>
        </g>
        <!-- dark keyline: holds the edge over the light squares -->
        <g stroke="#42182f" stroke-width="33" fill="#42182f">
        <text x="562" y="288">sophia sky</text>
        <text x="562" y="434">reddehase</text>
        </g>
        <!-- cream halo: holds the edge over the dark squares -->
        <g stroke="#f2ebd9" stroke-width="19.0" fill="#f2ebd9">
        <text x="562" y="288">sophia sky</text>
        <text x="562" y="434">reddehase</text>
        </g>
        <g fill="#a8386b">
        <text x="562" y="288">sophia sky</text>
        <text x="562" y="434">reddehase</text>
        </g>
      </g>

      <rect x="276.2" y="483.0" width="564.0" height="60.0" rx="14" fill="#22321f" opacity="0.85"/>
      <rect x="276.2" y="478.0" width="564.0" height="60.0" rx="14" fill="#33492e"/>
      <text x="562" y="516" text-anchor="middle"
            font-family="Poppins" font-weight="700" font-size="23" letter-spacing="7.5"
            fill="#f2ebd9">TEXAS APARTMENT LOCATOR</text>

      <!-- cream sparkles, sitting on the dark squares like the pin -->
      <g fill="#f2ebd9">
        <path transform="translate(880,120) scale(1.9)" d="M20 1 C21.6 12 28 18.4 39 20 C28 21.6 21.6 28 20 39 C18.4 28 12 21.6 1 20 C12 18.4 18.4 12 20 1 Z"/>
        <path transform="translate(1030,44) scale(1.1)" d="M20 1 C21.6 12 28 18.4 39 20 C28 21.6 21.6 28 20 39 C18.4 28 12 21.6 1 20 C12 18.4 18.4 12 20 1 Z"/>
      </g>
    </svg>
    <div class="compliance">TREC #831516 &nbsp;&#183;&nbsp; SPIRIT REAL ESTATE GROUP, LLC</div>
  </div>
</body>
</html>
