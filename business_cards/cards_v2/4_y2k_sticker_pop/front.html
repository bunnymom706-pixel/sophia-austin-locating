<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Y2K Sticker Pop — Front</title>
<link rel="stylesheet" href="../../assets/fonts/fonts.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1125px; height: 675px; overflow: hidden; background: #e8123c; }

  .card {
    position: relative;
    width: 1125px;
    height: 675px;
    overflow: hidden;
    background: #fff6f0;
    font-family: 'Poppins', sans-serif;
  }

  .pattern {
    position: absolute;
    inset: 0;
    background-image:
        linear-gradient(45deg, #e8123c 25%, transparent 25%, transparent 75%, #e8123c 75%),
        linear-gradient(45deg, #e8123c 25%, transparent 25%, transparent 75%, #e8123c 75%);
      background-color: #ff8fb3;
      background-size: 180px 180px;
      background-position: 0 0, 90px 90px;
  }

  .sparkle { position: absolute; }
  .sparkle svg { display: block; }

  .stack {
    position: absolute;
    left: 37.5px; right: 37.5px;
    top: 78px;
    text-align: center;
  }
  .role { margin-top: 10px; }

  .compliance {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    bottom: 62px;
    background: #fff6f0;
    border-radius: 999px;
    padding: 9px 26px;
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.9px;
    color: #7d0f2b;
    white-space: nowrap;
    box-shadow: 0 0 0 3px #7d0f2b, 0 5px 0 rgba(0,0,0,0.16);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="pattern"></div>

    <div class="sparkle" style="top:139px; left:927px;">
      <svg width="62" height="62" viewBox="0 0 40 40"><path d="M20 1 C21.6 12 28 18.4 39 20 C28 21.6 21.6 28 20 39 C18.4 28 12 21.6 1 20 C12 18.4 18.4 12 20 1 Z" fill="#fff6f0"/></svg>
    </div>
    <div class="sparkle" style="top:480px; left:142px;">
      <svg width="54" height="54" viewBox="0 0 40 40"><path d="M20 1 C21.6 12 28 18.4 39 20 C28 21.6 21.6 28 20 39 C18.4 28 12 21.6 1 20 C12 18.4 18.4 12 20 1 Z" fill="#fff6f0"/></svg>
    </div>
    <div class="sparkle" style="top:484px; left:820px;">
      <svg width="46" height="46" viewBox="0 0 40 40"><path d="M20 1 C21.6 12 28 18.4 39 20 C28 21.6 21.6 28 20 39 C18.4 28 12 21.6 1 20 C12 18.4 18.4 12 20 1 Z" fill="#fff6f0"/></svg>
    </div>

    <div class="stack">
      <svg width="1050" height="330" viewBox="0 0 1050 330" xmlns="http://www.w3.org/2000/svg">
        <g font-family="Bagel Fat One" font-size="132" text-anchor="middle"
         stroke-linejoin="round" paint-order="stroke">
        <!-- cast shadow -->
        <g stroke="#3d0512" stroke-width="32" fill="#3d0512" opacity="0.22" transform="translate(6,9)">
          <text x="525" y="128">sophia sky</text>
          <text x="525" y="272">reddehase</text>
        </g>
        <!-- dark keyline: holds the edge over the light squares -->
        <g stroke="#3d0512" stroke-width="32" fill="#3d0512">
          <text x="525" y="128">sophia sky</text>
          <text x="525" y="272">reddehase</text>
        </g>
        <!-- cream halo: holds the edge over the dark squares -->
        <g stroke="#fff6f0" stroke-width="18.0" fill="#fff6f0">
          <text x="525" y="128">sophia sky</text>
          <text x="525" y="272">reddehase</text>
        </g>
        <g fill="#7a0b24">
          <text x="525" y="128">sophia sky</text>
          <text x="525" y="272">reddehase</text>
        </g>
      </g>
      </svg>
      <div class="role">
        <svg width="1050" height="46" viewBox="0 0 1050 46" xmlns="http://www.w3.org/2000/svg">
          <rect x="238.5" y="-2.0" width="566.0" height="61.0" rx="14" fill="#55071c" opacity="0.85"/>
      <rect x="238.5" y="-7.0" width="566.0" height="61.0" rx="14" fill="#7d0f2b"/>
      <text x="525" y="32" text-anchor="middle"
                font-family="Poppins" font-weight="700" font-size="24" letter-spacing="7"
                fill="#fff6f0">TEXAS APARTMENT LOCATOR</text>
        </svg>
      </div>
    </div>

    <div class="compliance">TREC #831516 &nbsp;·&nbsp; SPIRIT REAL ESTATE GROUP, LLC</div>
  </div>
</body>
</html>
