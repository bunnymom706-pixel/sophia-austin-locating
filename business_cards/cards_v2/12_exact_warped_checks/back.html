<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Exact Warped Checks — Back</title>
<link rel="stylesheet" href="../../assets/fonts/fonts.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1125px; height: 675px; overflow: hidden; background: #f2a3d4; }

  .card {
    position: relative;
    width: 1125px;
    height: 675px;
    overflow: hidden;
    background: #f2a3d4;
    font-family: 'Poppins', sans-serif;
  }

  .strip { position: absolute; left: 0; right: 0; top: 0; height: 300px; overflow: hidden; }

  .name { position: absolute; left: 62px; top: 30px; }

  .body {
    position: absolute;
    left: 78px;
    right: 78px;
    top: 356px;
    display: grid;
    grid-template-columns: 1fr 204px;
    column-gap: 40px;
    align-items: start;
  }

  .icons { display: flex; gap: 16px; margin-bottom: 22px; }
  .icons svg { display: block; }

  .lines {
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 25px;
    line-height: 1.58;
    color: #3f5a2c;
  }

  /* QR straight on the pink, no tile — as on the pin */
  .qr { width: 204px; height: 204px; }
  .qr img { width: 100%; height: 100%; object-fit: contain; display: block; }

  .compliance {
    position: absolute;
    left: 78px;
    bottom: 46px;
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    font-size: 13.5px;
    letter-spacing: 1.2px;
    color: #3f5a2c;
  }
  .qr-cap {
    position: absolute;
    right: 78px;  top: 574px;  width: 204px;
    text-align: center;
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 1.5px;
    line-height: 1.3;
    color: #3f5a2c;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="strip">
      <svg width="1125" height="300" viewBox="0 0 1125 300" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern id="checks" width="204" height="204" patternUnits="userSpaceOnUse">
            <rect width="204" height="204" fill="#f2a3d4"/>
            <rect width="102" height="102" fill="#e8542c"/>
            <rect x="102" y="102" width="102" height="102" fill="#e8542c"/>
          </pattern>
          <filter id="warp" x="-25%" y="-25%" width="150%" height="150%"
                  filterUnits="objectBoundingBox" primitiveUnits="userSpaceOnUse">
            <feTurbulence type="fractalNoise" baseFrequency="0.0042 0.0062" numOctaves="2" seed="11" result="n"/>
            <feDisplacementMap in="SourceGraphic" in2="n" scale="70" xChannelSelector="R" yChannelSelector="G"/>
          </filter>
        </defs>
        <g filter="url(#warp)">
          <rect x="-200" y="-200" width="1525" height="700" fill="url(#checks)"/>
        </g>
      </svg>
    </div>

    <div class="name">
      <svg width="900" height="260" viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg">
        <g font-family="Bagel Fat One" font-size="92">
          <g fill="#3f5a2c" opacity="0.55" transform="translate(6,7)">
            <text x="0" y="92">sophia sky</text>
            <text x="0" y="192">reddehase</text>
          </g>
          <g fill="#7a9b52">
            <text x="0" y="92">sophia sky</text>
            <text x="0" y="192">reddehase</text>
          </g>
        </g>
        <text x="6" y="240" font-family="Poppins" font-weight="700" font-size="21" letter-spacing="6.5"
              stroke="#3f5a2c" stroke-width="6" stroke-linejoin="round" paint-order="stroke"
              fill="#f7e6c9">TEXAS APARTMENT LOCATOR</text>
      </svg>
    </div>

    <div class="body">
      <div>
        <div class="icons">
          <svg width="46" height="46" viewBox="0 0 44 44" fill="none" stroke="#3f5a2c" stroke-width="2.6">
            <circle cx="22" cy="22" r="18"/>
            <path d="M16 14.5c1.6 0 2 .6 2.6 2l1 2.4c.4 1 .2 1.6-.6 2.2l-1 .8c1.2 2.6 3.3 4.7 5.9 5.9l.8-1c.6-.8 1.2-1 2.2-.6l2.4 1c1.4.6 2 1 2 2.6 0 2-1.6 3.4-3.6 3.4C20.7 33.2 12.8 25.3 12.8 18.1c0-2 1.4-3.6 3.2-3.6Z" fill="#3f5a2c" stroke="none"/>
          </svg>
          <svg width="46" height="46" viewBox="0 0 44 44" fill="none" stroke="#3f5a2c" stroke-width="2.6">
            <circle cx="22" cy="22" r="18"/>
            <rect x="12" y="16" width="20" height="13" rx="2.6"/>
            <path d="M12.6 17.4 22 24l9.4-6.6"/>
          </svg>
          <svg width="46" height="46" viewBox="0 0 44 44" fill="none" stroke="#3f5a2c" stroke-width="2.6">
            <circle cx="22" cy="22" r="18"/>
            <ellipse cx="22" cy="22" rx="7.4" ry="18"/>
            <path d="M4.6 16.4h34.8M4.6 27.6h34.8"/>
          </svg>
        </div>
        <div class="lines">
          (512) 676-1215<br>
          sparkapt.com/sophia-reddehase<br>
          sophia.reddehase@spiritre.com
        </div>
      </div>

      <div class="qr">
        <img src="../../assets/v2/qr_warped_dark_on_pink.png" alt="QR code linking to Sophia Reddehase&#39;s intake form">
      </div>
    </div>

    <div class="compliance">TREC #831516 &nbsp;·&nbsp; BROKERED BY SPIRIT REAL ESTATE GROUP, LLC</div>
    <div class="qr-cap">FILL OUT MY FORM TO GET STARTED</div>
  </div>
</body>
</html>
