<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Exact Warped Checks — Front</title>
<link rel="stylesheet" href="../../assets/fonts/fonts.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1125px; height: 675px; overflow: hidden; background: #f2a3d4; }

  .card {
    position: relative;
    width: 1125px;
    height: 675px;
    overflow: hidden;
    background: #f2a3d4;
    font-family: 'Poppins', sans-serif;
  }

  .bg { position: absolute; inset: 0; }
  .type { position: absolute; inset: 0; }
  .compliance {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    bottom: 56px;
    background: #f7e6c9;
    border-radius: 999px;
    padding: 9px 26px;
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    font-size: 14.5px;
    letter-spacing: 1.4px;
    color: #3f5a2c;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div class="card">
    <svg class="bg" width="1125" height="675" viewBox="0 0 1125 675" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="checks" width="204" height="204" patternUnits="userSpaceOnUse">
          <rect width="204" height="204" fill="#f2a3d4"/>
          <rect width="102" height="102" fill="#e8542c"/>
          <rect x="102" y="102" width="102" height="102" fill="#e8542c"/>
        </pattern>
        <filter id="warp" x="-25%" y="-25%" width="150%" height="150%"
                filterUnits="objectBoundingBox" primitiveUnits="userSpaceOnUse">
          <feTurbulence type="fractalNoise" baseFrequency="0.0042 0.0062" numOctaves="2" seed="11" result="n"/>
          <feDisplacementMap in="SourceGraphic" in2="n" scale="78" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
      </defs>
      <g filter="url(#warp)">
        <rect x="-200" y="-200" width="1525" height="1075" fill="url(#checks)"/>
      </g>
    </svg>

    <svg class="type" width="1125" height="675" viewBox="0 0 1125 675" xmlns="http://www.w3.org/2000/svg">
      <g font-family="Bagel Fat One" font-size="130" text-anchor="middle">
        <g stroke="#2b3d1e" stroke-width="30" fill="#2b3d1e" opacity="0.24"
           stroke-linejoin="round" paint-order="stroke" transform="translate(6,9)">
          <text x="562" y="296">sophia sky</text>
          <text x="562" y="438">reddehase</text>
        </g>
        <g stroke="#2b3d1e" stroke-width="30" fill="#2b3d1e"
           stroke-linejoin="round" paint-order="stroke">
          <text x="562" y="296">sophia sky</text>
          <text x="562" y="438">reddehase</text>
        </g>
        <g stroke="#f7e6c9" stroke-width="17" fill="#f7e6c9"
           stroke-linejoin="round" paint-order="stroke">
          <text x="562" y="296">sophia sky</text>
          <text x="562" y="438">reddehase</text>
        </g>
        <g fill="#7a9b52">
          <text x="562" y="296">sophia sky</text>
          <text x="562" y="438">reddehase</text>
        </g>
      </g>

      <text x="562" y="520" text-anchor="middle"
            font-family="Poppins" font-weight="700" font-size="24" letter-spacing="7.5"
            stroke="#3f5a2c" stroke-width="7" stroke-linejoin="round" paint-order="stroke"
            fill="#f7e6c9">TEXAS APARTMENT LOCATOR</text>

      <g fill="#7a9b52">
        <path transform="translate(898,74) scale(2.2)" d="M20 1 C21.6 12 28 18.4 39 20 C28 21.6 21.6 28 20 39 C18.4 28 12 21.6 1 20 C12 18.4 18.4 12 20 1 Z"/>
        <path transform="translate(1008,160) scale(1.2)" d="M20 1 C21.6 12 28 18.4 39 20 C28 21.6 21.6 28 20 39 C18.4 28 12 21.6 1 20 C12 18.4 18.4 12 20 1 Z"/>
      </g>
    </svg>
    <div class="compliance">TREC #831516 &nbsp;&#183;&nbsp; SPIRIT REAL ESTATE GROUP, LLC</div>
  </div>
</body>
</html>
