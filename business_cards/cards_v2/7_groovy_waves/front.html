<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Groovy Waves — Front</title>
<link rel="stylesheet" href="../../assets/fonts/fonts.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1125px;
    height: 675px;
    overflow: hidden;
    background: #e8532e;
  }

  .card {
    position: relative;
    width: 1125px;
    height: 675px;
    overflow: hidden;
    background: #e8532e;
    font-family: 'Poppins', sans-serif;
  }

  .waves { position: absolute; inset: 0; }

  .type { position: absolute; inset: 0; }

  .handle {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    bottom: 196px;
    background: #f6b4d0;
    border-radius: 999px;
    padding: 12px 34px;
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 21px;
    letter-spacing: 2.6px;
    color: #c4381a;
    white-space: nowrap;
  }

  .compliance {
    position: absolute;
    left: 0; right: 0;
    bottom: 58px;
    text-align: center;
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    font-size: 14.5px;
    letter-spacing: 1.5px;
    color: #ffd9c8;
  }

  /* Broker block. TREC 22 TAC 535.155(a)(2): broker name >= half the largest
     agent contact item on the face. Sizes here are checked by verify_trec.py. */
  .broker {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    bottom: 44px;
    background: #fff6ef;
    border-radius: 22px;
    padding: 11px 32px 13px;
    text-align: center;
    white-space: nowrap;
  }
  .broker .eyebrow {
    display: block;
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 5px;
    color: #c4381a;
  }
  .broker .bname {
    display: block;
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 44px;
    line-height: 1.06;
    color: #8a2a12;
    margin-top: 2px;
  }
  .broker .tline {
    display: block;
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    font-size: 16.5px;
    letter-spacing: 1.5px;
    color: #a8492c;
    margin-top: 5px;
  }
</style>
</head>
<body>
  <div class="card">
    <!-- groovy pink waves down both edges -->
    <svg class="waves" width="1125" height="675" viewBox="0 0 1125 675" xmlns="http://www.w3.org/2000/svg">
      <path fill="#f6b4d0"
            d="M0,0 L128,0 C 176,96 78,168 122,262 C 166,356 74,420 124,516 C 168,602 86,640 112,675 L0,675 Z"/>
      <path fill="#f6b4d0"
            d="M1125,0 L997,0 C 949,96 1047,168 1003,262 C 959,356 1051,420 1001,516 C 957,602 1039,640 1013,675 L1125,675 Z"/>
    </svg>

    <svg class="type" width="1125" height="675" viewBox="0 0 1125 675" xmlns="http://www.w3.org/2000/svg">
      <g transform="rotate(-4 562 300)">
        <g font-family="Shrikhand" text-anchor="middle" fill="#fff6ef">
          <text x="562" y="212" font-size="86">sophia sky</text>
          <text x="562" y="324" font-size="86">reddehase</text>
        </g>
      </g>
      <text x="562" y="404" text-anchor="middle"
            font-family="Poppins" font-weight="700" font-size="24" letter-spacing="8" fill="#ffd9c8">APARTMENT LOCATING &#183; AUSTIN, TX</text>
    </svg>

    <div class="handle">AUSTIN, TX &nbsp;·&nbsp; NO FEE TO YOU</div>
    <div class="broker">
      <span class="eyebrow">BROKERED BY</span>
      <span class="bname">Spirit Real Estate Group, LLC</span>
      <span class="tline">TREC #831516 &nbsp;&#183;&nbsp; SOPHIA SKY REDDEHASE, SALES AGENT</span>
    </div>
  </div>
</body>
</html>
