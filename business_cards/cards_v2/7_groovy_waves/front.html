<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Groovy Waves — Front</title>
<link rel="stylesheet" href="../../assets/fonts/fonts.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1125px;
    height: 675px;
    overflow: hidden;
    background: #e8532e;
  }

  .card {
    position: relative;
    width: 1125px;
    height: 675px;
    overflow: hidden;
    background: #e8532e;
    font-family: 'Poppins', sans-serif;
  }

  .waves { position: absolute; inset: 0; }

  .type { position: absolute; inset: 0; }



  .services {
    position: absolute; left: 50%; transform: translateX(-50%); top: 392px;
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 2.4px;
    text-transform: uppercase;
    white-space: nowrap;
    color: #fff6ef;
    background: #a82d12;
    padding: 8px 22px 9px;
    border-radius: 999px;
    box-shadow: 0 5px 0 #741e0b;
  }

  /* broker mark: navy logo on a cream plate so it holds on any ground.
     450px gives a 54px "SPIRIT" cap against the 96px name — 1.79x */
  .brokermark {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    bottom: 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    background: #fff6ef;
    border-radius: 18px;
    padding: 14px 28px 11px;
    box-shadow: 0 0 0 3px #a82d12, 0 6px 0 #741e0b;
  }
  .brokermark img { width: 450px; height: auto; display: block; }
  .brokermark .line {
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.9px;
    color: #a82d12;
    white-space: nowrap;
  }
</style>
<style id="print-safe">
  /* print safe zone: small type kept at least 1/16 in inside the trim */
  .brokermark { translate: 0px -6px; }
</style>
</head>
<body>
  <div class="card">
    <!-- groovy pink waves down both edges -->
    <svg class="waves" width="1125" height="675" viewBox="0 0 1125 675" xmlns="http://www.w3.org/2000/svg">
      <path fill="#f6b4d0"
            d="M0,0 L128,0 C 176,96 78,168 122,262 C 166,356 74,420 124,516 C 168,602 86,640 112,675 L0,675 Z"/>
      <path fill="#f6b4d0"
            d="M1125,0 L997,0 C 949,96 1047,168 1003,262 C 959,356 1051,420 1001,516 C 957,602 1039,640 1013,675 L1125,675 Z"/>
    </svg>

    <!-- the orange field either side of the type was bare -->
    <svg class="sparkles" width="1125" height="675" viewBox="0 0 1125 675"
         xmlns="http://www.w3.org/2000/svg" style="position:absolute; inset:0;">
      <g fill="#fff6ef">
        <path transform="translate(140,230) scale(1.0)" d="M20 1 C21.6 12 28 18.4 39 20 C28 21.6 21.6 28 20 39 C18.4 28 12 21.6 1 20 C12 18.4 18.4 12 20 1 Z"/>
        <path transform="translate(946,196) scale(0.8)" d="M20 1 C21.6 12 28 18.4 39 20 C28 21.6 21.6 28 20 39 C18.4 28 12 21.6 1 20 C12 18.4 18.4 12 20 1 Z"/>
        <path transform="translate(158,442) scale(0.62)" d="M20 1 C21.6 12 28 18.4 39 20 C28 21.6 21.6 28 20 39 C18.4 28 12 21.6 1 20 C12 18.4 18.4 12 20 1 Z"/>
      </g>
    </svg>

    <svg class="type" width="1125" height="675" viewBox="0 0 1125 675" xmlns="http://www.w3.org/2000/svg">
      <g transform="rotate(-4 562 200)">
        <g font-family="Shrikhand" text-anchor="middle" fill="#fff6ef">
          <text x="562" y="148" font-size="96">sophia sky</text>
          <text x="562" y="260" font-size="96">reddehase</text>
        </g>
      </g>
      <rect x="264.0" y="318.0" width="588.0" height="61.0" rx="14" fill="#741e0b" opacity="0.85"/>
      <rect x="264.0" y="313.0" width="588.0" height="61.0" rx="14" fill="#a82d12"/>
      <text x="562" y="352" text-anchor="middle"
            font-family="Poppins" font-weight="700" font-size="24" letter-spacing="8" fill="#fff6ef">TEXAS APARTMENT LOCATOR</text>
    </svg>

    <div class="services">Relocation &nbsp;&#183;&nbsp; Second Chance &nbsp;&#183;&nbsp; First-Time Renters &nbsp;&#183;&nbsp; Luxury</div>
    <div class="brokermark">
      <img src="../../assets/v2/spirit_logo_navy.png" alt="Spirit Real Estate Group">
      <span class="line">TREC #831516 &nbsp;&#183;&nbsp; SPIRIT REAL ESTATE GROUP</span>
    </div>
  </div>
</body>
</html>
