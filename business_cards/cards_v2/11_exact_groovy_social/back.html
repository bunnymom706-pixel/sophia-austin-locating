<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Exact Groovy Social — Back</title>
<link rel="stylesheet" href="../../assets/fonts/fonts.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 675px; height: 1125px; overflow: hidden; background: #f6b4d0; }

  .card {
    position: relative;
    width: 675px;
    height: 1125px;
    overflow: hidden;
    background: #f6b4d0;
    font-family: 'Poppins', sans-serif;
  }

  .waves { position: absolute; inset: 0; }
  .ring { position: absolute; top: 176px; left: 50%; transform: translateX(-50%); }

  .details {
    position: absolute;
    left: 62px;
    right: 62px;
    top: 662px;
    text-align: center;
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 24px;
    line-height: 1.86;
    color: #b8341a;
  }

  .skyline { position: absolute; left: 0; top: 0; }

  .site {
    position: absolute;
    left: 0; right: 0;
    bottom: 210px;
    text-align: center;
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 20px;
    letter-spacing: 3px;
    color: #8f2408;
  }

  .brokermark {
    position: absolute;
    left: 50%; transform: translateX(-50%); bottom: 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 7px;
    background: #fff6ef;
    border-radius: 16px;
    padding: 10px 20px 8px;
    box-shadow: 0 0 0 3px #a82d12, 0 5px 0 #741e0b;
  }
  /* 286px wide gives a 34px "SPIRIT" cap against the 62px agent name
     — inside the half-size floor in 22 TAC 535.155(a)(2), with margin */
  .brokermark img { width: 286px; height: auto; display: block; }
  .brokermark .line {
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.9px;
    color: #a82d12;
    white-space: nowrap;
  }
</style>
<style id="print-safe">
  /* print safe zone: small type kept at least 1/16 in inside the trim */
  .brokermark { translate: 0px -9px; }
  .site { letter-spacing: 2px; }
  .url-fit { white-space: nowrap; font-size: 0.85em; }
</style>
</head>
