<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Exact Groovy Social — Front</title>
<link rel="stylesheet" href="../../assets/fonts/fonts.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  /* vertical card: 2.25 x 3.75in @300dpi incl. bleed */
  html, body { width: 675px; height: 1125px; overflow: hidden; background: #e8532e; }

  .card {
    position: relative;
    width: 675px;
    height: 1125px;
    overflow: hidden;
    background: #e8532e;
    font-family: 'Poppins', sans-serif;
  }

  .waves { position: absolute; inset: 0; }

  /* the big pink arch that holds the scan block */
  .arch {
    position: absolute;
    left: 62px;
    top: 300px;
    width: 424px;
    height: 600px;
    background: #f6b4d0;
    border-radius: 212px 212px 34px 34px;
  }

  .qr-box {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    top: 214px;
    width: 306px;
    height: 306px;
    background: #ffffff;
    border-radius: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .qr-box img { width: 262px; height: 262px; object-fit: contain; }

  .handle-pill {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    bottom: 46px;
    background: #a82d12;
    border-radius: 999px;
    padding: 11px 28px;
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 19px;
    letter-spacing: 2.4px;
    color: #ffeee6;
    white-space: nowrap;
  }

  /* "let's find your place" running bottom-to-top up the right edge */
  .vertical {
    position: absolute;
    right: 26px;
    top: 50%;
    width: 132px;
    height: 940px;
    transform: translateY(-50%);
  }
  .vertical svg {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%) rotate(-90deg);
  }


  /* the orange band between the top wave and the arch was dead space */
  .skyline { position: absolute; left: 0; top: 0; }


  /* broker mark: navy logo on a cream plate so it holds on any ground.
     the only agent contact on this face is the 19px phone pill; 380px gives a 45px cap */
  .brokermark {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    bottom: 44px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    background: #fff6ef;
    border-radius: 18px;
    padding: 14px 28px 11px;
    box-shadow: 0 0 0 3px #a82d12, 0 6px 0 #741e0b;
  }
  .brokermark img { width: 380px; height: auto; display: block; }
  .brokermark .line {
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.9px;
    color: #a82d12;
    white-space: nowrap;
  }

  /* FREE, as a sticker on the corner of the QR tile */
  .free {
    position: absolute; left: 215px; top: 275px;            
    
    
    
    width: 118px;
    height: 118px;
    transform: rotate(-12deg);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-family: 'Poppins', sans-serif;
    font-weight: 800;
    font-size: 14px;
    line-height: 1.05;
    letter-spacing: 0.6px;
    color: #fff6ef;
    filter: drop-shadow(0 4px 0 rgba(0,0,0,0.18));
  }
  .free svg { position: absolute; inset: 0; width: 100%; height: 100%; fill: #a82d12; }
  .free span { position: relative; }
  .free b { display: block; font-size: 24px; line-height: 1; letter-spacing: 0.5px; }
</style>
<style id="print-safe">
  /* print safe zone: small type kept at least 1/16 in inside the trim */
  .brokermark { translate: 0px -2px; }
</style>
