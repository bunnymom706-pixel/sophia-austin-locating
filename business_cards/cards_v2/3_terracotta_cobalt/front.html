<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Terracotta Cobalt — Front</title>
<link rel="stylesheet" href="../../assets/fonts/fonts.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1125px; height: 675px; overflow: hidden; background: #c1502e; }

  .card {
    position: relative;
    width: 1125px;
    height: 675px;
    overflow: hidden;
    background: #f3e6d2;
    font-family: 'Poppins', sans-serif;
  }

  .pattern {
    position: absolute;
    inset: 0;
    background-image:
        linear-gradient(45deg, #c1502e 25%, transparent 25%, transparent 75%, #c1502e 75%),
        linear-gradient(45deg, #c1502e 25%, transparent 25%, transparent 75%, #c1502e 75%);
      background-color: #f3e6d2;
      background-size: 225px 225px;
      background-position: 0 0, 112.5px 112.5px;
  }

  .sparkle { position: absolute; }
  .sparkle svg { display: block; }



  .stack {
    position: absolute;
    left: 37.5px; right: 37.5px;
    top: 44px;
    text-align: center;
  }
  .stack svg { display: block; margin: 0 auto; }

  /* role and services are pills so they size to their own text */
  .role, .services {
    display: inline-block;
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    text-transform: uppercase;
    white-space: nowrap;
    color: #f3e6d2;
    background: #1b2a6b;
    box-shadow: 0 5px 0 #0d1730;
  }
  .role {
    margin-top: 6px;
    font-size: 24px;
    letter-spacing: 7px;
    padding: 12px 30px 13px;
    border-radius: 14px;
  }
  .services {
    display: block;
    width: fit-content;
    margin: 12px auto 0;
    font-size: 15px;
    letter-spacing: 2.4px;
    padding: 8px 22px 9px;
    border-radius: 999px;
  }

  /* broker mark: navy logo on a cream plate so it holds on any pattern.
     450px wide gives a 54px "SPIRIT" cap against the 96px name — 1.79x,
     inside the half-size floor in 22 TAC 535.155(a)(2) with margin */
  .brokermark {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    bottom: 42px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    background: #f3e6d2;
    border-radius: 18px;
    padding: 14px 28px 11px;
    box-shadow: 0 0 0 3px #1b2a6b, 0 6px 0 #0d1730;
  }
  .brokermark img { width: 450px; height: auto; display: block; }
  .brokermark .line {
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.9px;
    color: #1b2a6b;
    white-space: nowrap;
  }
</style>
<style id="print-safe">
  /* print safe zone: small type kept at least 1/16 in inside the trim */
  .brokermark { translate: 0px -4px; }
</style>
</head>
<body>
  <div class="card">
    <div class="pattern"></div>

    <div class="sparkle" style="top:139px; left:927px;">
      <svg width="62" height="62" viewBox="0 0 40 40"><path d="M20 1 C21.6 12 28 18.4 39 20 C28 21.6 21.6 28 20 39 C18.4 28 12 21.6 1 20 C12 18.4 18.4 12 20 1 Z" fill="#f3e6d2"/></svg>
    </div>
    <div class="sparkle" style="top:480px; left:142px;">
      <svg width="54" height="54" viewBox="0 0 40 40"><path d="M20 1 C21.6 12 28 18.4 39 20 C28 21.6 21.6 28 20 39 C18.4 28 12 21.6 1 20 C12 18.4 18.4 12 20 1 Z" fill="#f3e6d2"/></svg>
    </div>
    <div class="sparkle" style="top:484px; left:820px;">
      <svg width="46" height="46" viewBox="0 0 40 40"><path d="M20 1 C21.6 12 28 18.4 39 20 C28 21.6 21.6 28 20 39 C18.4 28 12 21.6 1 20 C12 18.4 18.4 12 20 1 Z" fill="#f3e6d2"/></svg>
    </div>

    <div class="stack">
      <svg width="1050" height="228" viewBox="0 0 1050 228" xmlns="http://www.w3.org/2000/svg">
        <g font-family="Bagel Fat One" font-size="96" text-anchor="middle"
           stroke-linejoin="round" paint-order="stroke">
          <!-- cast shadow -->
          <g stroke="#0d1730" stroke-width="23" fill="#0d1730" opacity="0.22" transform="translate(4.5,6.5)">
            <text x="525" y="92">sophia sky</text>
            <text x="525" y="197">reddehase</text>
          </g>
          <!-- dark keyline: holds the edge over the light squares -->
          <g stroke="#0d1730" stroke-width="23" fill="#0d1730">
            <text x="525" y="92">sophia sky</text>
            <text x="525" y="197">reddehase</text>
          </g>
          <!-- light halo: holds the edge over the dark squares -->
          <g stroke="#f3e6d2" stroke-width="13" fill="#f3e6d2">
            <text x="525" y="92">sophia sky</text>
            <text x="525" y="197">reddehase</text>
          </g>
          <g fill="#1b2a6b">
            <text x="525" y="92">sophia sky</text>
            <text x="525" y="197">reddehase</text>
          </g>
        </g>
      </svg>
      <div class="role">Texas Apartment Locator</div>
      <div class="services">Relocation &nbsp;&#183;&nbsp; Second Chance &nbsp;&#183;&nbsp; First-Time Renters &nbsp;&#183;&nbsp; Luxury</div>
    </div>

    <div class="brokermark">
      <img src="../../assets/v2/spirit_logo_navy.png" alt="Spirit Real Estate Group">
      <span class="line">TREC #831516 &nbsp;&#183;&nbsp; SPIRIT REAL ESTATE GROUP</span>
    </div>
  </div>
</body>
</html>
