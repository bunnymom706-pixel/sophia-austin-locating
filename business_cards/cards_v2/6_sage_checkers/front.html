<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sage Checkers — Front</title>
<link rel="stylesheet" href="../../assets/fonts/fonts.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1125px;
    height: 675px;
    overflow: hidden;
    background: #4d6b46;
  }

  .card {
    position: relative;
    width: 1125px;
    height: 675px;
    overflow: hidden;
    background: #f2ebd9;
    font-family: 'Poppins', sans-serif;
  }

  /* full-bleed checkerboard: 112.5px cells = exactly 10 x 6 */
  .checks {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(45deg,  #4d6b46 25%, transparent 25%, transparent 75%, #4d6b46 75%),
      linear-gradient(45deg,  #4d6b46 25%, transparent 25%, transparent 75%, #4d6b46 75%);
    background-size: 225px 225px;
    background-position: 0 0, 112.5px 112.5px;
  }

  .sparkle { position: absolute; }
  .sparkle svg { display: block; }

  .stack {
    position: absolute;
    left: 37.5px; right: 37.5px;
    top: 78px;
    text-align: center;
  }

  .role {
    margin-top: 10px;
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 21px;
    letter-spacing: 7px;
    text-transform: uppercase;
  }

  .compliance {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    bottom: 62px;
    background: #f2ebd9;
    border-radius: 999px;
    padding: 9px 26px;
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    font-size: 14.5px;
    letter-spacing: 1.4px;
    color: #3c5537;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="checks"></div>

    <div class="sparkle" style="top:139px; left:927px;">
      <svg width="62" height="62" viewBox="0 0 40 40"><path d="M20 1 C21.6 12 28 18.4 39 20 C28 21.6 21.6 28 20 39 C18.4 28 12 21.6 1 20 C12 18.4 18.4 12 20 1 Z" fill="#f2ebd9"/></svg>
    </div>
    <div class="sparkle" style="top:480px; left:142px;">
      <svg width="54" height="54" viewBox="0 0 40 40"><path d="M20 1 C21.6 12 28 18.4 39 20 C28 21.6 21.6 28 20 39 C18.4 28 12 21.6 1 20 C12 18.4 18.4 12 20 1 Z" fill="#f2ebd9"/></svg>
    </div>
    <div class="sparkle" style="top:484px; left:820px;">
      <svg width="46" height="46" viewBox="0 0 40 40"><path d="M20 1 C21.6 12 28 18.4 39 20 C28 21.6 21.6 28 20 39 C18.4 28 12 21.6 1 20 C12 18.4 18.4 12 20 1 Z" fill="#f2ebd9"/></svg>
    </div>

    <div class="stack">
      <!-- SVG text so the cream outline sits cleanly over the checks -->
      <svg width="1050" height="330" viewBox="0 0 1050 330" xmlns="http://www.w3.org/2000/svg">
        <g font-family="Bagel Fat One" font-size="132" text-anchor="middle"
         stroke-linejoin="round" paint-order="stroke">
        <!-- cast shadow -->
        <g stroke="#42182f" stroke-width="32" fill="#42182f" opacity="0.22" transform="translate(6,9)">
          <text x="525" y="128">sophia sky</text>
          <text x="525" y="272">reddehase</text>
        </g>
        <!-- dark keyline: holds the edge over the light squares -->
        <g stroke="#42182f" stroke-width="32" fill="#42182f">
          <text x="525" y="128">sophia sky</text>
          <text x="525" y="272">reddehase</text>
        </g>
        <!-- cream halo: holds the edge over the dark squares -->
        <g stroke="#f2ebd9" stroke-width="18.0" fill="#f2ebd9">
          <text x="525" y="128">sophia sky</text>
          <text x="525" y="272">reddehase</text>
        </g>
        <g fill="#a8386b">
          <text x="525" y="128">sophia sky</text>
          <text x="525" y="272">reddehase</text>
        </g>
      </g>
      </svg>
      <div class="role">
        <svg width="1050" height="46" viewBox="0 0 1050 46" xmlns="http://www.w3.org/2000/svg">
          <text x="525" y="32" text-anchor="middle"
                font-family="Poppins" font-weight="700" font-size="24" letter-spacing="7"
                stroke="#4d6b46" stroke-width="7" stroke-linejoin="round" paint-order="stroke" fill="#f2ebd9">TEXAS APARTMENT LOCATOR</text>
        </svg>
      </div>
    </div>

    <div class="compliance">TREC #831516 &nbsp;·&nbsp; SPIRIT REAL ESTATE GROUP, LLC</div>
  </div>
</body>
</html>
