<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sage Checkers — Front</title>
<link rel="stylesheet" href="../../assets/fonts/fonts.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1125px; height: 675px; overflow: hidden; background: #4d6b46; }

  .card {
    position: relative;
    width: 1125px;
    height: 675px;
    overflow: hidden;
    background: #f2ebd9;
    font-family: 'Poppins', sans-serif;
  }

  /* full-bleed checkerboard: 112.5px cells = exactly 10 x 6 */
  .checks {
    position: absolute;
    left: 0; right: 0; top: 0;
    height: 430px;
    background-image:
      linear-gradient(45deg,  #4d6b46 25%, transparent 25%, transparent 75%, #4d6b46 75%),
      linear-gradient(45deg,  #4d6b46 25%, transparent 25%, transparent 75%, #4d6b46 75%);
    background-size: 225px 225px;
    background-position: 0 0, 112.5px 112.5px;
  }

  /* cream footer carrying the broker block, bleeds off the bottom edge */
  .band {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 245px;
    background: #f2ebd9;
  }
  .band::before {
    content: "";
    position: absolute;
    left: 0; right: 0; top: 0;
    height: 6px;
    background: #a8386b;
  }

  .sparkle { position: absolute; }
  .sparkle svg { display: block; }

  .type { position: absolute; inset: 0; }
</style>
</head>
<body>
  <div class="card">
    <div class="checks"></div>
    <div class="band"></div>

    <div class="sparkle" style="top:44px; left:930px;">
      <svg width="58" height="58" viewBox="0 0 40 40"><path d="M20 1 C21.6 12 28 18.4 39 20 C28 21.6 21.6 28 20 39 C18.4 28 12 21.6 1 20 C12 18.4 18.4 12 20 1 Z" fill="#f2ebd9"/></svg>
    </div>
    <div class="sparkle" style="top:118px; left:1024px;">
      <svg width="30" height="30" viewBox="0 0 40 40"><path d="M20 1 C21.6 12 28 18.4 39 20 C28 21.6 21.6 28 20 39 C18.4 28 12 21.6 1 20 C12 18.4 18.4 12 20 1 Z" fill="#f2ebd9"/></svg>
    </div>
    <div class="sparkle" style="top:250px; left:96px;">
      <svg width="44" height="44" viewBox="0 0 40 40"><path d="M20 1 C21.6 12 28 18.4 39 20 C28 21.6 21.6 28 20 39 C18.4 28 12 21.6 1 20 C12 18.4 18.4 12 20 1 Z" fill="#f2ebd9"/></svg>
    </div>

    <svg class="type" width="1125" height="675" viewBox="0 0 1125 675" xmlns="http://www.w3.org/2000/svg">
      <!-- Name: cream fill reads 4.96:1 on the green squares; the deep-rose
           outline draws the letterform where it crosses a cream square. -->
      <g font-family="Bagel Fat One" font-size="92" text-anchor="middle"
         stroke="#a8386b" stroke-width="9" stroke-linejoin="round" paint-order="stroke" fill="#f2ebd9">
        <text x="562" y="176">sophia sky</text>
        <text x="562" y="278">reddehase</text>
      </g>

      <text x="562" y="352" text-anchor="middle"
            font-family="Poppins" font-weight="700" font-size="21" letter-spacing="6.5"
            stroke="#4d6b46" stroke-width="7" stroke-linejoin="round" paint-order="stroke"
            fill="#f2ebd9">APARTMENT LOCATING &#183; AUSTIN, TX</text>

      <!-- Broker block. TREC 22 TAC 535.155(a)(2) wants the broker's name at
           >= half the largest agent contact item; name is 92px, so >= 46px. -->
      <text x="562" y="500" text-anchor="middle"
            font-family="Poppins" font-weight="700" font-size="16" letter-spacing="5.5"
            fill="#a8386b">BROKERED BY</text>
      <text x="562" y="558" text-anchor="middle"
            font-family="Poppins" font-weight="700" font-size="48"
            fill="#3c5537">Spirit Real Estate Group, LLC</text>
      <text x="562" y="602" text-anchor="middle"
            font-family="Poppins" font-weight="600" font-size="19" letter-spacing="2.4"
            fill="#4d6b46">TREC #831516 &#183; SOPHIA SKY REDDEHASE, SALES AGENT</text>
    </svg>
  </div>
</body>
</html>
