<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sage Checkers — Back</title>
<link rel="stylesheet" href="../../assets/fonts/fonts.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1125px;
    height: 675px;
    overflow: hidden;
    background: #4d6b46;
  }

  .card {
    position: relative;
    width: 1125px;
    height: 675px;
    overflow: hidden;
    background: #f2ebd9;
    font-family: 'Poppins', sans-serif;
  }

  /* cream head, green body */
  .band {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 415px;
    background: #4d6b46;
  }

  .sparkle { position: absolute; }
  .sparkle svg { display: block; }

  .head {
    position: absolute;
    top: 46px;
    left: 37.5px; right: 37.5px;
    text-align: center;
  }

  .body {
    position: absolute;
    left: 78px;
    top: 292px;
  }

  .icons {
    display: flex;
    gap: 16px;
    margin-bottom: 22px;
  }
  .icons svg { display: block; }

  .lines {
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    font-size: 25px;
    line-height: 1.62;
    color: #f2ebd9;
    letter-spacing: 0.6px;
  }

  .qr-card {
    position: absolute;
    right: 78px;
    top: 286px;
    width: 236px;
    height: 236px;
    background: #ffffff;
    border-radius: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .qr-card img {
    width: 196px;
    height: 196px;
    object-fit: contain;
  }

  .brokermark {
    position: absolute;
    left: 78px;
    bottom: 46px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
  }
  /* width set so the "SPIRIT" cap height clears half the 84px agent name,
     per 22 TAC 535.155(a)(2); see the note in spirit_logo.svg */
  .brokermark img { width: 352px; height: auto; display: block; }
  .brokermark .line {
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 1.4px;
    color: #cfe0c8;
  }
  .qr-cap {
    position: absolute;
    right: 78px;  top: 534px;  width: 236px;
    text-align: center;
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 1.5px;
    line-height: 1.3;
    color: #cfe0c8;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="band"></div>

    <div class="sparkle" style="top:52px; left:52px;">
      <svg width="48" height="48" viewBox="0 0 40 40"><path d="M20 1 C21.6 12 28 18.4 39 20 C28 21.6 21.6 28 20 39 C18.4 28 12 21.6 1 20 C12 18.4 18.4 12 20 1 Z" fill="#a8386b"/></svg>
    </div>
    <div class="sparkle" style="top:110px; left:104px;">
      <svg width="26" height="26" viewBox="0 0 40 40"><path d="M20 1 C21.6 12 28 18.4 39 20 C28 21.6 21.6 28 20 39 C18.4 28 12 21.6 1 20 C12 18.4 18.4 12 20 1 Z" fill="#a8386b"/></svg>
    </div>
    <div class="sparkle" style="top:50px; right:56px;">
      <svg width="42" height="42" viewBox="0 0 40 40"><path d="M20 1 C21.6 12 28 18.4 39 20 C28 21.6 21.6 28 20 39 C18.4 28 12 21.6 1 20 C12 18.4 18.4 12 20 1 Z" fill="#a8386b"/></svg>
    </div>

    <div class="head">
      <svg width="1050" height="238" viewBox="0 0 1050 238" xmlns="http://www.w3.org/2000/svg">
        <g font-family="Bagel Fat One" font-size="84" text-anchor="middle" fill="#a8386b">
          <text x="525" y="90">sophia sky reddehase</text>
        </g>
        <text x="525" y="150" text-anchor="middle"
              font-family="Poppins" font-weight="700" font-size="22" letter-spacing="6.5" fill="#4d6b46">TEXAS APARTMENT LOCATOR</text>
      </svg>
    </div>

    <div class="body">
      <div>
        <div class="icons">
          <!-- phone -->
          <svg width="46" height="46" viewBox="0 0 44 44" fill="none" stroke="#f2ebd9" stroke-width="2.4">
            <circle cx="22" cy="22" r="18"/>
            <path d="M16 14.5c1.6 0 2 .6 2.6 2l1 2.4c.4 1 .2 1.6-.6 2.2l-1 .8c1.2 2.6 3.3 4.7 5.9 5.9l.8-1c.6-.8 1.2-1 2.2-.6l2.4 1c1.4.6 2 1 2 2.6 0 2-1.6 3.4-3.6 3.4C20.7 33.2 12.8 25.3 12.8 18.1c0-2 1.4-3.6 3.2-3.6Z" fill="#f2ebd9" stroke="none"/>
          </svg>
          <!-- mail -->
          <svg width="46" height="46" viewBox="0 0 44 44" fill="none" stroke="#f2ebd9" stroke-width="2.4">
            <circle cx="22" cy="22" r="18"/>
            <rect x="12" y="16" width="20" height="13" rx="2.6"/>
            <path d="M12.6 17.4 22 24l9.4-6.6"/>
          </svg>
          <!-- globe -->
          <svg width="46" height="46" viewBox="0 0 44 44" fill="none" stroke="#f2ebd9" stroke-width="2.4">
            <circle cx="22" cy="22" r="18"/>
            <ellipse cx="22" cy="22" rx="7.4" ry="18"/>
            <path d="M4.6 16.4h34.8M4.6 27.6h34.8"/>
          </svg>
        </div>
        <div class="lines">
          (512) 676-1215<br>
          sophia.reddehase@spiritre.com<br>
          sparkapt.com/sophia-reddehase
        </div>
      </div>
    </div>

      <div class="qr-card">
        <img src="../../assets/v2/qr_marshmallow_whitebg.png" alt="QR code linking to Sophia Reddehase&#39;s intake form">
      </div>
      <div class="qr-cap">FILL OUT MY FORM TO GET STARTED</div>

    <div class="brokermark">
      <img src="../../assets/v2/spirit_logo_cream.png" alt="Spirit Real Estate Group, LLC">
      <span class="line">SOPHIA SKY REDDEHASE &nbsp;&#183;&nbsp; TREC #831516</span>
    </div>
  </div>
</body>
</html>
