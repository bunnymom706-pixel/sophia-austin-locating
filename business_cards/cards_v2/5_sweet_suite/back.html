<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sweet Suite — Back</title>
<link rel="stylesheet" href="../../assets/fonts/fonts.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1125px;
    height: 675px;
    overflow: hidden;
    background: #ffd9e6;
  }

  .card {
    position: relative;
    width: 1125px;
    height: 675px;
    overflow: hidden;
    font-family: 'Nunito', sans-serif;
    background:
      radial-gradient(circle at 12% 10%, #fff6ea 0%, rgba(255,246,234,0) 46%),
      linear-gradient(170deg, #ffeef4 0%, #ffe1ec 42%, #ffd3e4 100%);
  }

  .sun {
    position: absolute;
    top: -60px; left: -50px;
    width: 190px; height: 190px;
    border-radius: 50%;
    background: radial-gradient(circle at 62% 60%, #fff3cd 0%, #ffd98a 62%, #ffcb6b 100%);
    box-shadow: 0 0 0 14px rgba(255,217,138,0.28);
  }
  .cloud {
    position: absolute;
    background: #ffffff;
    border-radius: 999px;
    opacity: 0.8;
  }
  .cloud::before, .cloud::after {
    content: "";
    position: absolute;
    background: #ffffff;
    border-radius: 50%;
  }
  .c1 { width: 116px; height: 36px; top: 66px; left: 838px; }
  .c1::before { width: 50px; height: 50px; top: -22px; left: 18px; }
  .c1::after  { width: 36px; height: 36px; top: -14px; left: 62px; }

  .sparkle { position: absolute; filter: drop-shadow(0 1px 1px rgba(214,110,160,0.30)); }
  .sparkle svg { display: block; }

  .city {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 190px;
  }

  .safe {
    position: absolute;
    top: 37.5px; left: 37.5px; right: 37.5px; bottom: 37.5px;
    display: grid;
    grid-template-columns: 300px 1fr;
    column-gap: 40px;
    align-items: center;
  }

  /* ---- QR framed as a little front door ---- */
  .door-col {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .door {
    position: relative;
    width: 262px;
    height: 322px;
    background: #ffffff;
    border-radius: 131px 131px 22px 22px;
    box-shadow: 0 12px 0 rgba(214,110,160,0.20), 0 18px 30px rgba(191,63,119,0.22);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .door::after {
    content: "";
    position: absolute;
    inset: 12px;
    border-radius: 119px 119px 12px 12px;
    border: 3px dashed #ffc7e0;
  }
  .door .transom {
    position: absolute;
    top: 26px;
    left: 50%;
    transform: translateX(-50%);
    width: 150px;
    height: 62px;
    border-radius: 75px 75px 8px 8px;
    background: linear-gradient(180deg, #ffe9a8 0%, #ffd66b 100%);
    box-shadow: inset 0 -3px 0 rgba(214,110,160,0.15);
  }
  .door .knob {
    position: absolute;
    right: 26px;
    top: 202px;
    width: 15px;
    height: 15px;
    border-radius: 50%;
    background: #ffcb6b;
    box-shadow: 0 2px 0 rgba(214,110,160,0.30);
  }
  .door img {
    position: absolute;
    top: 108px;
    left: 50%;
    transform: translateX(-50%);
    width: 188px;
    height: 188px;
    object-fit: contain;
    border-radius: 14px;
    background: #ffffff;
    z-index: 2;
  }
  .mat {
    position: absolute;
    bottom: -26px;
    left: 50%;
    transform: translateX(-50%);
    width: 214px;
    padding: 7px 0 8px;
    text-align: center;
    background: #f0a07a;
    border-radius: 12px;
    box-shadow: 0 5px 0 rgba(214,110,160,0.22);
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: 16px;
    letter-spacing: 3px;
    color: #6b2140;
    z-index: 3;
  }

  /* ---- contact column ---- */
  .content {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 13px;
    padding-bottom: 26px;
  }
  .headline {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: 40px;
    line-height: 1.05;
    color: #a3164e;
  }
  .subline {
    font-weight: 800;
    font-size: 19px;
    letter-spacing: 1.6px;
    text-transform: uppercase;
    color: #fff1f6;
    margin-top: -4px;
    background: #6b2140;
    box-shadow: 0 4px 0 #42132780;
    border-radius: 999px;
    padding: 9px 20px 10px;
    display: inline-block;
    width: fit-content;
    align-self: flex-start;
    margin-bottom: 14px;
  }
  .contact-pills {
    display: flex;
    flex-direction: column;
    gap: 11px;
    margin-top: 4px;
  }
  .pill {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #ffffff;
    border: 2px solid #ffc2dd;
    border-radius: 999px;
    padding: 11px 20px;
    box-shadow: 0 3px 0 rgba(214,110,160,0.22);
    font-weight: 800;
    font-size: 17px;
    color: #7a2048;
    white-space: nowrap;
  }
  .pill .ico { font-size: 17px; line-height: 1; }
  .pill.accent {
    background: #ff5fa2;
    border-color: #ff5fa2;
    color: #ffffff;
    box-shadow: 0 3px 0 #c2255c;
  }

  .brokermark {
    position: absolute;
    right: 62px; top: 44px;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 6px;
  }
  /* 184px wide gives a 22px "SPIRIT" cap against the 40px agent name
     — inside the half-size floor in 22 TAC 535.155(a)(2), with margin */
  .brokermark img { width: 184px; height: auto; display: block; }
  .brokermark .line {
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.9px;
    color: #5c1735;
    white-space: nowrap;
  }

  /* FREE, as a sticker on the corner of the QR tile */
  .free {
    position: absolute; left: 127px; top: 139px;            
    
    
    
    width: 118px;
    height: 118px;
    transform: rotate(-12deg);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-family: 'Poppins', sans-serif;
    font-weight: 800;
    font-size: 14px;
    line-height: 1.05;
    letter-spacing: 0.6px;
    color: #fff6ea;
    filter: drop-shadow(0 4px 0 rgba(0,0,0,0.18));
  }
  .free svg { position: absolute; inset: 0; width: 100%; height: 100%; fill: #6b2140; }
  .free span { position: relative; }
  .free b { display: block; font-size: 24px; line-height: 1; letter-spacing: 0.5px; }
</style>
</head>
<body>
  <div class="card">

      <!-- lavender low-rise -->
      <g>

        <rect x="954" y="36" width="142" height="20" rx="9"  fill="#b7a2e0"/>
        <g fill="#ffd66b">
          <rect x="986"  y="66" width="22" height="22" rx="6"/>

      <g fill="#8fd3bd">

          <img src="../../assets/v2/qr_marshmallow_whitebg.png" alt="QR code linking to Sophia Reddehase&#39;s intake form">

      <div class="content">

        <div class="contact-pills">

</body>
