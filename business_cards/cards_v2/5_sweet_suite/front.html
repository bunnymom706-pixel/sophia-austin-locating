<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sweet Suite — Front</title>
<link rel="stylesheet" href="../../assets/fonts/fonts.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1125px;
    height: 675px;
    overflow: hidden;
    background: #ffd9e6;
  }

  .card {
    position: relative;
    width: 1125px;
    height: 675px;
    overflow: hidden;
    font-family: 'Nunito', sans-serif;
    background:
      radial-gradient(circle at 84% 12%, #fff6ea 0%, rgba(255,246,234,0) 46%),
      linear-gradient(170deg, #ffeef4 0%, #ffe1ec 42%, #ffd3e4 100%);
  }

  /* ---- sky decor: sun + clouds, bleeds to edges ---- */
  .sun {
    position: absolute;
    top: -46px; right: -40px;
    width: 210px; height: 210px;
    border-radius: 50%;
    background: radial-gradient(circle at 38% 36%, #fff3cd 0%, #ffd98a 62%, #ffcb6b 100%);
    box-shadow: 0 0 0 18px rgba(255,203,107,0.42), 0 0 0 40px rgba(255,217,138,0.22);
  }
  .cloud {
    position: absolute;
    background: #ffffff;
    border-radius: 999px;
    opacity: 0.85;
  }
  .cloud::before, .cloud::after {
    content: "";
    position: absolute;
    background: #ffffff;
    border-radius: 50%;
  }
  .c1 { width: 132px; height: 42px; top: 62px; left: 372px; }
  .c1::before { width: 58px; height: 58px; top: -26px; left: 22px; }
  .c1::after  { width: 42px; height: 42px; top: -16px; left: 70px; }
  .c2 { width: 96px; height: 32px; top: 150px; left: 962px; opacity: 0.7; }
  .c2::before { width: 44px; height: 44px; top: -20px; left: 16px; }
  .c2::after  { width: 32px; height: 32px; top: -12px; left: 52px; }

  /* ---- sparkles ---- */
  .sparkle { position: absolute; filter: drop-shadow(0 1px 1px rgba(214,110,160,0.30)); }
  .sparkle svg { display: block; }

  /* ---- city block illustration, bleeds to bottom edge ---- */
  .city {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 268px;
  }

  /* ---- safe area ---- */
  .safe {
    position: absolute;
    top: 37.5px; left: 37.5px; right: 37.5px; bottom: 37.5px;
    display: grid;
    grid-template-columns: 306px 1fr;
    column-gap: 36px;
  }

  /* ---- Sophia in an arched apartment window ---- */
  .window-col {
    position: relative;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding-top: 16px;
  }
  .window {
    position: relative;
    width: 292px;
    height: 356px;
    background: #ffffff;
    border-radius: 146px 146px 26px 26px;
    box-shadow: 0 14px 0 rgba(214,110,160,0.20), 0 20px 34px rgba(191,63,119,0.22);
  }
  .window .pane {
    position: absolute;
    inset: 14px;
    border-radius: 132px 132px 16px 16px;
    overflow: hidden;
    background: linear-gradient(175deg, #ffe6f2 0%, #ffd0e4 100%);
  }
  .window .pane::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    box-shadow: inset 0 0 0 3px rgba(255,255,255,0.9);
    z-index: 4;
  }
  .window .glare {
    position: absolute;
    top: 10px; left: 18px;
    width: 62px; height: 118px;
    background: linear-gradient(160deg, rgba(255,255,255,0.42), rgba(255,255,255,0));
    border-radius: 40px 40px 30px 30px;
    transform: rotate(-10deg);
    z-index: 3;
  }
  .headshot {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 50% 22%;
    z-index: 2;
    display: block;
  }
  /* windowsill + planter */
  .sill {
    position: absolute;
    left: -18px;
    bottom: -20px;
    width: 328px;
    height: 26px;
    background: #ffffff;
    border-radius: 13px;
    box-shadow: 0 6px 0 rgba(214,110,160,0.20);
    z-index: 4;
  }
  .planter {
    position: absolute;
    right: -12px;
    bottom: -2px;
    width: 66px;
    height: 42px;
    z-index: 6;
  }

  /* ---- text column ---- */
  .content {
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    padding-top: 10px;
    gap: 13px;
  }
  .name-panel {
    background: rgba(255,255,255,0.80);
    border-radius: 26px;
    padding: 16px 24px 14px;
    box-shadow: 0 3px 0 rgba(214,110,160,0.18);
  }
  .name {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: 46px;
    line-height: 1.02;
    color: #a3164e;
  }
  .title {
    margin-top: 7px;
    font-weight: 800;
    font-size: 19px;
    letter-spacing: 1.6px;
    text-transform: uppercase;
    color: #6b2140;
  }
  .tagline {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 23px;
    color: #b03a68;
    padding-left: 4px;
  }
  .pills { display: flex; flex-direction: column; gap: 11px; }
  .pill-row { display: flex; gap: 11px; }
  .pill {
    display: flex;
    align-items: center;
    gap: 9px;
    background: #ffffff;
    border: 2px solid #ffc2dd;
    border-radius: 999px;
    padding: 10px 18px;
    box-shadow: 0 3px 0 rgba(214,110,160,0.22);
    font-weight: 800;
    font-size: 16px;
    color: #7a2048;
    white-space: nowrap;
  }
  .pill .ico { font-size: 16px; line-height: 1; }
  .pill.wide { flex: 1; }
  .pill.accent {
    background: #ff5fa2;
    border-color: #ff5fa2;
    color: #ffffff;
    box-shadow: 0 3px 0 #c2255c;
  }
</style>
</head>
