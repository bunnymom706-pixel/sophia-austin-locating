<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sweet Suite — Front</title>
<link rel="stylesheet" href="../../assets/fonts/fonts.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1125px; height: 675px; overflow: hidden; background: #ffd3e4; }

  .card {
    position: relative;
    width: 1125px;
    height: 675px;
    overflow: hidden;
    font-family: 'Poppins', sans-serif;
    background:
      radial-gradient(circle at 84% 10%, #fff6ea 0%, rgba(255,246,234,0) 44%),
      linear-gradient(170deg, #ffeef4 0%, #ffe1ec 44%, #ffd3e4 100%);
  }

  .sun {
    position: absolute;
    top: -52px; right: -44px;
    width: 210px; height: 210px;
    border-radius: 50%;
    background: radial-gradient(circle at 38% 36%, #fff3cd 0%, #ffd98a 62%, #ffcb6b 100%);
    box-shadow: 0 0 0 18px rgba(255,203,107,0.36);
  }

  /* the illustrated block is this card's pattern */
  .city { position: absolute; left: 0; right: 0; bottom: 0; height: 246px; }

  .sparkle { position: absolute; }
  .sparkle svg { display: block; }

  .stack { position: absolute; left: 37.5px; right: 37.5px; top: 44px; text-align: center; }
  .stack svg { display: block; margin: 0 auto; }
  .role {
    display: inline-block; margin-top: 6px;
    font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 24px; letter-spacing: 7px;
    text-transform: uppercase; white-space: nowrap;
    color: #fff6ea; background: #6b2140; padding: 12px 30px 13px; border-radius: 14px;
    box-shadow: 0 5px 0 #421327;
  }


  .services {
    display: block; width: fit-content; margin: 12px auto 0;
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 2.4px;
    text-transform: uppercase;
    white-space: nowrap;
    color: #fff6ea;
    background: #6b2140;
    padding: 8px 22px 9px;
    border-radius: 999px;
    box-shadow: 0 5px 0 #421327;
  }

  /* broker mark: navy logo on a cream plate so it holds on any ground.
     450px gives a 54px "SPIRIT" cap against the 96px name — 1.79x */
  .brokermark {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    bottom: 42px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    background: #fff6ea;
    border-radius: 18px;
    padding: 14px 28px 11px;
    box-shadow: 0 0 0 3px #6b2140, 0 6px 0 #421327;
  }
  .brokermark img { width: 450px; height: auto; display: block; }
  .brokermark .line {
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.9px;
    color: #6b2140;
    white-space: nowrap;
  }
</style>
</head>
<body>

    <div class="stack">
      <svg width="1050" height="228" viewBox="0 0 1050 228" xmlns="http://www.w3.org/2000/svg">
        <g font-family="Bagel Fat One" font-size="96" text-anchor="middle"
         stroke-linejoin="round" paint-order="stroke">

</body>
</html>
