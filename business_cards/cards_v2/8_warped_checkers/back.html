<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Warped Checkers — Back</title>
<link rel="stylesheet" href="../../assets/fonts/fonts.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1125px;
    height: 675px;
    overflow: hidden;
    background: #f2a3d4;
  }

  .card {
    position: relative;
    width: 1125px;
    height: 675px;
    overflow: hidden;
    background: #f2a3d4;
    font-family: 'Poppins', sans-serif;
  }

  /* warped checker band across the top, name sits on it */
  .strip {
    position: absolute;
    left: 0; right: 0; top: 0;
    height: 268px;
    overflow: hidden;
  }

  .name {
    position: absolute;
    left: 37.5px; right: 37.5px;
    top: 58px;
    text-align: center;
  }

  .body {
    position: absolute;
    left: 78px;
    top: 300px;
  }

  .icons { display: flex; gap: 15px; margin-bottom: 20px; }
  .icons svg { display: block; }

  .lines {
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 24px;
    line-height: 1.6;
    color: #3f5a2c;
    letter-spacing: 0.4px;
  }

  .qr-card {
    position: absolute;
    right: 78px;
    top: 296px;
    width: 214px;
    height: 214px;
    background: #ffffff;
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 5px 0 rgba(63,90,44,0.28);
  }
  .qr-card img { width: 180px; height: 180px; object-fit: contain; }

  .qr-cap {
    position: absolute;
    right: 78px;  top: 532px;  width: 214px;
    text-align: center;
    font-family: 'Poppins', sans-serif;
    font-weight: 800;
    font-size: 19px;
    letter-spacing: 0.8px;
    line-height: 1.28;
    color: #f7e6c9;
    background: #3f5a2c;
    box-shadow: 0 4px 0 #26361a;
    border-radius: 13px;
    padding: 12px 16px 13px;
    box-sizing: border-box;
  }
  .brokermark {
    position: absolute;
    left: 78px;  bottom: 40px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 7px;
  }
  /* 396px wide gives a 47px "SPIRIT" cap against the 86px agent name
     — inside the half-size floor in 22 TAC 535.155(a)(2), with margin */
  .brokermark img { width: 396px; height: auto; display: block; }
  .brokermark .line {
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.9px;
    color: #31461f;
    white-space: nowrap;
  }

  /* FREE, as a sticker on the corner of the QR tile */
  .free {
    position: absolute; left: 707px; top: 343px;            
    
    
    
    width: 118px;
    height: 118px;
    transform: rotate(-12deg);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-family: 'Poppins', sans-serif;
    font-weight: 800;
    font-size: 14px;
    line-height: 1.05;
    letter-spacing: 0.6px;
    color: #f7e6c9;
    filter: drop-shadow(0 4px 0 rgba(0,0,0,0.18));
  }
  .free svg { position: absolute; inset: 0; width: 100%; height: 100%; fill: #3f5a2c; }
  .free span { position: relative; }
  .free b { display: block; font-size: 24px; line-height: 1; letter-spacing: 0.5px; }
</style>
<style id="print-safe">
  /* print safe zone: small type kept at least 1/16 in inside the trim */
  .brokermark { translate: 0px -17px; }
  .qr-cap { translate: 0px -3px; }
  .body { translate: 0px -12px; }
</style>
</head>
<body>
  <div class="card">
    <div class="strip">
      <svg width="1125" height="268" viewBox="0 0 1125 268" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern id="checks" width="204" height="204" patternUnits="userSpaceOnUse">
            <rect width="204" height="204" fill="#f2a3d4"/>
            <rect width="102" height="102" fill="#e8542c"/>
            <rect x="102" y="102" width="102" height="102" fill="#e8542c"/>
          </pattern>
          <filter id="warp" x="-25%" y="-25%" width="150%" height="150%"
                  filterUnits="objectBoundingBox" primitiveUnits="userSpaceOnUse">
            <feTurbulence type="fractalNoise" baseFrequency="0.0042 0.0062" numOctaves="2" seed="11" result="n"/>
            <feDisplacementMap in="SourceGraphic" in2="n" scale="70" xChannelSelector="R" yChannelSelector="G"/>
          </filter>
        </defs>
        <g filter="url(#warp)">
          <rect x="-200" y="-200" width="1525" height="668" fill="url(#checks)"/>
        </g>
      </svg>
    </div>

    <div class="name">
      <svg width="1050" height="200" viewBox="0 0 1050 200" xmlns="http://www.w3.org/2000/svg">
        <g font-family="Bagel Fat One" font-size="86" text-anchor="middle">
        <g stroke="#2b3d1e" stroke-width="30" fill="#2b3d1e" opacity="0.24"
           stroke-linejoin="round" paint-order="stroke" transform="translate(6,9)">
            <text x="525" y="80">sophia sky reddehase</text>
        </g>
        <g stroke="#2b3d1e" stroke-width="30" fill="#2b3d1e"
           stroke-linejoin="round" paint-order="stroke">
            <text x="525" y="80">sophia sky reddehase</text>
        </g>
        <g stroke="#f7e6c9" stroke-width="17" fill="#f7e6c9"
           stroke-linejoin="round" paint-order="stroke">
            <text x="525" y="80">sophia sky reddehase</text>
        </g>
        <g fill="#7a9b52">
            <text x="525" y="80">sophia sky reddehase</text>
        </g>
      </g>
        <rect x="262.2" y="109.0" width="519.0" height="55.0" rx="13" fill="#1b2712" opacity="0.85"/>
        <rect x="262.2" y="105.0" width="519.0" height="55.0" rx="13" fill="#2b3d1e"/>
        <text x="525" y="140" text-anchor="middle"
              font-family="Poppins" font-weight="700" font-size="22" letter-spacing="6.5" fill="#f7e6c9">TEXAS APARTMENT LOCATOR</text>
      </svg>
    </div>

    <div class="body">
      <div>
        <div class="icons">
          <svg width="44" height="44" viewBox="0 0 44 44" fill="none" stroke="#3f5a2c" stroke-width="2.6">
            <circle cx="22" cy="22" r="18"/>
            <path d="M16 14.5c1.6 0 2 .6 2.6 2l1 2.4c.4 1 .2 1.6-.6 2.2l-1 .8c1.2 2.6 3.3 4.7 5.9 5.9l.8-1c.6-.8 1.2-1 2.2-.6l2.4 1c1.4.6 2 1 2 2.6 0 2-1.6 3.4-3.6 3.4C20.7 33.2 12.8 25.3 12.8 18.1c0-2 1.4-3.6 3.2-3.6Z" fill="#3f5a2c" stroke="none"/>
          </svg>
          <svg width="44" height="44" viewBox="0 0 44 44" fill="none" stroke="#3f5a2c" stroke-width="2.6">
            <circle cx="22" cy="22" r="18"/>
            <rect x="12" y="16" width="20" height="13" rx="2.6"/>
            <path d="M12.6 17.4 22 24l9.4-6.6"/>
          </svg>
          <svg width="44" height="44" viewBox="0 0 44 44" fill="none" stroke="#3f5a2c" stroke-width="2.6">
            <circle cx="22" cy="22" r="18"/>
            <ellipse cx="22" cy="22" rx="7.4" ry="18"/>
            <path d="M4.6 16.4h34.8M4.6 27.6h34.8"/>
          </svg>
        </div>
        <div class="lines">
          (512) 676-1215<br>
          sophia.reddehase@spiritre.com<br>
          sparkapt.com/inquiry/sophia-reddehase859
        </div>
      </div>

    </div>

    <div class="qr-cap">FILL OUT MY FORM<br>TO GET STARTED</div>
      <div class="qr-card">
        <img src="../../assets/v2/qr_marshmallow_whitebg.png" alt="QR code linking to Sophia Reddehase&#39;s intake form">
      </div>

    <div class="brokermark">
      <img src="../../assets/v2/spirit_logo_navy.png" alt="Spirit Real Estate Group">
      <span class="line">SOPHIA SKY REDDEHASE &nbsp;&#183;&nbsp; TREC #831516</span>
    </div>
    <div class="free">
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><path d="M50.0,0.0 L59.1,10.0 L71.7,5.0 L75.6,17.9 L89.1,18.8 L86.9,32.2 L98.7,38.9 L91.0,50.0 L98.7,61.1 L86.9,67.8 L89.1,81.2 L75.6,82.1 L71.7,95.0 L59.1,90.0 L50.0,100.0 L40.9,90.0 L28.3,95.0 L24.4,82.1 L10.9,81.2 L13.1,67.8 L1.3,61.1 L9.0,50.0 L1.3,38.9 L13.1,32.2 L10.9,18.8 L24.4,17.9 L28.3,5.0 L40.9,10.0 Z"/></svg>
      <span><b>FREE</b>for renters</span>
    </div>
  </div>
</body>
</html>
