<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cherry Checkers — Back</title>
<link rel="stylesheet" href="../../assets/fonts/fonts.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1125px; height: 675px; overflow: hidden; background: #d91635; }

  .card {
    position: relative;
    width: 1125px;
    height: 675px;
    overflow: hidden;
    background: #fff8ee;
    font-family: 'Poppins', sans-serif;
  }

  /* cream head, cherry body */
  .band {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 415px;
    background: #d91635;
  }

  .sparkle { position: absolute; }
  .sparkle svg { display: block; }

  .head {
    position: absolute;
    top: 46px;
    left: 37.5px; right: 37.5px;
    text-align: center;
  }

  /* contacts left, QR right, brokermark bottom-left: each gets its own column
     so nothing collides when content changes */
  .body { position: absolute; left: 78px; top: 292px; }

  .icons { display: flex; gap: 16px; margin-bottom: 22px; }
  .icons svg { display: block; }

  .lines {
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 25px;
    line-height: 1.42;
    color: #fff8ee;
    letter-spacing: 0.6px;
  }

  .qr-col {
    position: absolute;
    right: 78px;
    top: 286px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  .qr-card {
    width: 236px;
    height: 236px;
    background: #fff8ee;
    border-radius: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .qr-card img { width: 196px; height: 196px; object-fit: contain; }
  .qr-cap {
    font-family: 'Poppins', sans-serif;
    font-weight: 800;
    font-size: 19px;
    letter-spacing: 0.8px;
    line-height: 1.28;
    text-align: center;
    color: #b00f28;
    max-width: 240px;
    background: #fff8ee;
    box-shadow: 0 4px 0 #8a0a20;
    border-radius: 13px;
    padding: 12px 16px 13px;
    box-sizing: border-box;
  }

  .brokermark {
    position: absolute;
    left: 78px;
    bottom: 46px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
    background: #fff8ee;
    border-radius: 16px;
    padding: 10px 20px 8px;
    box-shadow: 0 0 0 3px #a30f28, 0 5px 0 #6e0819;
  }
  /* 387px gives a 46px "SPIRIT" cap against the 84px
     agent name — inside the 535.155(a)(2) half-size floor, with margin */
  .brokermark img { width: 380px; height: auto; display: block; }
  .brokermark .line {
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.9px;
    color: #a30f28;
  }

  /* FREE, as a sticker on the corner of the QR tile */
  .free {
    position: absolute; left: 687px; top: 343px;        
    
    
    
    width: 118px;
    height: 118px;
    transform: rotate(-12deg);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-family: 'Poppins', sans-serif;
    font-weight: 800;
    font-size: 14px;
    line-height: 1.05;
    letter-spacing: 0.6px;
    color: #fff8ee;
    filter: drop-shadow(0 4px 0 rgba(0,0,0,0.18));
  }
  .free svg { position: absolute; inset: 0; width: 100%; height: 100%; fill: #a30f28; }
  .free span { position: relative; }
  .free b { display: block; font-size: 24px; line-height: 1; letter-spacing: 0.5px; }
</style>
</head>
<body>
  <div class="card">
    <div class="band"></div>

    </div>

    </div>

    <div class="head">

      <div class="icons">

          <circle cx="22" cy="22" r="18"/>
          <path d="M16 14.5c1.6 0 2 .6 2.6 2l1 2.4c.4 1 .2 1.6-.6 2.2l-1 .8c1.2 2.6 3.3 4.7 5.9 5.9l.8-1c.6-.8 1.2-1 2.2-.6l2.4 1c1.4.6 2 1 2 2.6 0 2-1.6 3.4-3.6 3.4C20.7 33.2 12.8 25.3 12.8 18.1c0-2 1.4-3.6 3.2-3.6Z" fill="#fff8ee" stroke="none"/>
        </svg>
        <svg width="46" height="46" viewBox="0 0 44 44" fill="none" stroke="#fff8ee" stroke-width="2.4">
          <circle cx="22" cy="22" r="18"/>
          <rect x="12" y="16" width="20" height="13" rx="2.6"/>
          <path d="M12.6 17.4 22 24l9.4-6.6"/>
        </svg>
        <svg width="46" height="46" viewBox="0 0 44 44" fill="none" stroke="#fff8ee" stroke-width="2.4">
          <circle cx="22" cy="22" r="18"/>
          <ellipse cx="22" cy="22" rx="7.4" ry="18"/>
          <path d="M4.6 16.4h34.8M4.6 27.6h34.8"/>
        </svg>
      </div>
      <div class="lines">
        (512) 676-1215<br>
        sophia.reddehase@spiritre.com<br>
        sparkapt.com/sophia-reddehase

    </div>

    <div class="qr-col">
      <div class="qr-card">
        <img src="../../assets/v2/qr_cherry.png" alt="QR code linking to Sophia Reddehase&#39;s intake form">
      </div>
      <div class="qr-cap">FILL OUT MY FORM<br>TO GET STARTED</div>
    </div>

    <div class="brokermark">
      <img src="../../assets/v2/spirit_logo_navy.png" alt="Spirit Real Estate Group, LLC">

      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><path d="M50.0,0.0 L59.1,10.0 L71.7,5.0 L75.6,17.9 L89.1,18.8 L86.9,32.2 L98.7,38.9 L91.0,50.0 L98.7,61.1 L86.9,67.8 L89.1,81.2 L75.6,82.1 L71.7,95.0 L59.1,90.0 L50.0,100.0 L40.9,90.0 L28.3,95.0 L24.4,82.1 L10.9,81.2 L13.1,67.8 L1.3,61.1 L9.0,50.0 L1.3,38.9 L13.1,32.2 L10.9,18.8 L24.4,17.9 L28.3,5.0 L40.9,10.0 Z"/></svg>
      <span><b>FREE</b>for renters</span>
    </div>
  </div>
</body>
</html>
