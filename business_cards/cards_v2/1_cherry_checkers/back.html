<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 1125px;
    height: 675px;
    overflow: hidden;
  }
  :root {
    --cherry: #D91635;
    --cherry-deep: #A80F27;
    --pink: #FFB4C8;
    --cream: #FFF8EE;
    --ink: #3A0B14;
  }
  .card {
    position: relative;
    width: 1125px;
    height: 675px;
    background: var(--cherry);
    overflow: hidden;
    font-family: 'Nunito', sans-serif;
  }
  .checker {
    position: absolute;
    top: -220px;
    left: -220px;
    width: 1565px;
    height: 1115px;
    background-image: repeating-conic-gradient(var(--cherry) 0% 25%, var(--pink) 0% 50%);
    background-size: 72px 72px;
    transform: rotate(6deg);
  }

  /* QR panel, left side */
  .qr-panel {
    position: absolute;
    top: 95px;
    left: 75px;
    width: 440px;
    height: 470px;
    background: var(--cream);
    border-radius: 34px;
    box-shadow: 0 10px 0 rgba(168, 15, 39, 0.35);
    z-index: 3;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 26px;
  }
  .qr-caption {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    color: var(--cherry-deep);
    font-size: 28px;
    line-height: 1.12;
    text-align: center;
    letter-spacing: 0.3px;
    margin: 0 0 18px 0;
  }
  .qr-frame {
    width: 320px;
    height: 320px;
    background: #ffffff;
    border-radius: 20px;
    border: 4px solid var(--cherry);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .qr-frame img {
    width: 296px;
    height: 296px;
    object-fit: contain;
    display: block;
  }

  /* Contact panel, right side */
  .contact-panel {
    position: absolute;
    top: 95px;
    right: 75px;
    width: 460px;
    height: 470px;
    background: var(--cream);
    border-radius: 34px;
    box-shadow: 0 10px 0 rgba(168, 15, 39, 0.35);
    z-index: 3;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 44px;
  }
  .contact-row {
    margin-bottom: 30px;
  }
  .contact-row:last-of-type {
    margin-bottom: 0;
  }
  .contact-label {
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    color: var(--cherry-deep);
    font-size: 16px;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin: 0 0 4px 0;
  }
  .contact-value {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    color: var(--ink);
    font-size: 32px;
    line-height: 1.1;
    margin: 0;
    word-break: break-word;
  }
  .contact-value.small {
    font-size: 26px;
  }
  .footer-license {
    position: absolute;
    top: 578px;
    left: 0;
    right: 0;
    margin: 0;
    text-align: center;
    z-index: 4;
  }
  .footer-license span {
    display: inline-block;
    background: var(--cream);
    color: var(--cherry-deep);
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 16px;
    letter-spacing: 0.3px;
    padding: 8px 22px;
    border-radius: 999px;
  }
</style>

<div class="card">
  <div class="checker"></div>

  <div class="qr-panel">
    <p class="qr-caption">SCAN TO FIND<br>YOUR NEXT APARTMENT</p>
    <div class="qr-frame">
      <img src="../../assets/v2/qr_cherry.png" alt="QR code to sparkapt.com/sophia-reddehase">
    </div>
  </div>

  <div class="contact-panel">
    <div class="contact-row">
      <p class="contact-label">Call / Text</p>
      <p class="contact-value">(512) 676-1215</p>
    </div>
    <div class="contact-row">
      <p class="contact-label">Email</p>
      <p class="contact-value small">sophia.reddehase<br>@spiritre.com</p>
    </div>
    <div class="contact-row">
      <p class="contact-label">Instagram</p>
      <p class="contact-value">@sophiasky.atx</p>
    </div>
  </div>

  <p class="footer-license"><span>TREC #831516 &nbsp;&middot;&nbsp; Brokered by Spirit Real Estate Group</span></p>
</div>
