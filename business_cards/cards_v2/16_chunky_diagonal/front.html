<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chunky Diagonal — Front</title>
<link rel="stylesheet" href="../../assets/fonts/fonts.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  /* vertical card: 2.25 x 3.75in @300dpi incl. bleed */
  html, body { width: 675px; height: 1125px; overflow: hidden; background: #f79ad3; }
  .card { position: relative; width: 675px; height: 1125px; overflow: hidden; background: #f79ad3;
          font-family: 'Poppins', sans-serif; }

  /* orange / pink split on a diagonal, yellow corner, as on the flyer */
  .split { position: absolute; inset: 0; }

  .name { position: absolute; left: 0; top: 0; }
  .role { position: absolute; left: 62px; top: 700px; }
  .services { position: absolute; left: 62px; top: 772px; }

  .role {
    
    font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 22px; letter-spacing: 6px;
    text-transform: uppercase; white-space: nowrap;
    color: #fff6ef; background: #8f2408; padding: 12px 30px 13px; border-radius: 14px;
    box-shadow: 0 5px 0 #5e1806;
  }
  .services {
    
    font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 13.5px; letter-spacing: 1.8px;
    text-transform: uppercase; white-space: nowrap;
    color: #fff6ef; background: #8f2408; padding: 8px 18px 9px; border-radius: 999px;
    box-shadow: 0 5px 0 #5e1806;
  }
  /* broker mark: navy logo on a cream plate. 420px gives a 50px cap against the 88px name — 1.76x */
  .brokermark {
    position: absolute; left: 50%; transform: translateX(-50%); bottom: 44px;
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    background: #fff6ef; border-radius: 18px; padding: 14px 28px 11px;
    box-shadow: 0 0 0 3px #8f2408, 0 6px 0 #5e1806;
  }
  .brokermark img { width: 420px; height: auto; display: block; }
  .brokermark .line {
    font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 15px; letter-spacing: 0.9px;
    color: #8f2408; white-space: nowrap;
  }</style>
</head>
<body>
  <div class="card">
    <svg class="split" width="675" height="1125" viewBox="0 0 675 1125" xmlns="http://www.w3.org/2000/svg">
      <rect width="675" height="1125" fill="#f79ad3"/>
      <path d="M0,0 L675,0 L675,700 Z" fill="#e8532e"/>
      <path d="M0,0 L675,0 L675,700 L0,0 Z" fill="#e8532e"/>
      <path d="M0,0 L0,470 L675,700 L675,0 Z" fill="#e8532e"/>
      <path d="M0,930 L0,1125 L280,1125 Z" fill="#f5c84a"/>
    </svg>

    <svg width="675" height="400" viewBox="0 0 675 400" xmlns="http://www.w3.org/2000/svg" style="position:absolute; inset:0;">
      <g fill="#fff6ef"><path transform="translate(548,64) scale(1.9)" d="M20 1 C21.6 12 28 18.4 39 20 C28 21.6 21.6 28 20 39 C18.4 28 12 21.6 1 20 C12 18.4 18.4 12 20 1 Z"/><path transform="translate(614,146) scale(1.1)" d="M20 1 C21.6 12 28 18.4 39 20 C28 21.6 21.6 28 20 39 C18.4 28 12 21.6 1 20 C12 18.4 18.4 12 20 1 Z"/></g>
    </svg>

    <!-- huge chunky pink type on the orange, tilted with the split -->
    <div class="name">
      <svg width="675" height="700" viewBox="0 0 675 700" xmlns="http://www.w3.org/2000/svg">
        <g transform="rotate(-9 337 330)" font-family="Bagel Fat One" font-size="88" text-anchor="middle"
           stroke-linejoin="round" paint-order="stroke">
          <g stroke="#8f2408" stroke-width="22" fill="#8f2408" opacity="0.22" transform="translate(4,6)">
            <text x="337" y="250">sophia</text><text x="337" y="346">sky</text><text x="337" y="442">reddehase</text>
          </g>
          <g stroke="#8f2408" stroke-width="22" fill="#8f2408">
            <text x="337" y="250">sophia</text><text x="337" y="346">sky</text><text x="337" y="442">reddehase</text>
          </g>
          <g stroke="#fff6ef" stroke-width="12" fill="#fff6ef">
            <text x="337" y="250">sophia</text><text x="337" y="346">sky</text><text x="337" y="442">reddehase</text>
          </g>
          <g fill="#f79ad3">
            <text x="337" y="250">sophia</text><text x="337" y="346">sky</text><text x="337" y="442">reddehase</text>
          </g>
        </g>
      </svg>
    </div>

    <div class="role">Texas Apartment Locator</div>
    <div class="services">Relocation &nbsp;&#183;&nbsp; Second Chance &nbsp;&#183;&nbsp; First-Time Renters &nbsp;&#183;&nbsp; Luxury</div>

    <div class="brokermark">
      <img src="../../assets/v2/spirit_logo_navy.png" alt="Spirit Real Estate Group, LLC">
      <span class="line">TREC #831516 &nbsp;&#183;&nbsp; SPIRIT REAL ESTATE GROUP, LLC</span>
    </div>
  </div>
</body>
</html>
