<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pink Gingham — Back</title>
<link rel="stylesheet" href="../../assets/fonts/fonts.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1125px;
    height: 675px;
    overflow: hidden;
    background: #f8f3ea;
  }

  .card {
    position: relative;
    width: 1125px;
    height: 675px;
    overflow: hidden;
    background: #f8f3ea;
    font-family: 'Poppins', sans-serif;
  }

  .type { position: absolute; inset: 0; }

  .qr {
    position: absolute;
    top: 230px;
    left: 112px;
    width: 292px;
    height: 292px;
    border-radius: 12px;
    overflow: hidden;
  }
  .qr img { width: 100%; height: 100%; object-fit: contain; }

  .details {
    position: absolute;
    left: 462px;
    top: 262px;
    width: 570px;
    transform: rotate(-7deg);
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 27px;
    line-height: 1.72;
    color: #b8332a;
    letter-spacing: 0.3px;
  }

  .qr-cap {
    position: absolute;
    left: 112px;  top: 534px;  width: 292px;
    text-align: center;
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 1.5px;
    line-height: 1.3;
    color: #b8332a;
  }
  .brokermark {
    position: absolute;
    right: 78px; bottom: 44px;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 7px;
  }
  /* 332px wide gives a 40px "SPIRIT" cap against the 72px agent name
     — inside the half-size floor in 22 TAC 535.155(a)(2), with margin */
  .brokermark img { width: 332px; height: auto; display: block; }
  .brokermark .line {
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    font-size: 13.5px;
    letter-spacing: 1.3px;
    color: #8f3128;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div class="card">
    <svg class="type" width="1125" height="675" viewBox="0 0 1125 675" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <path id="connectArc" d="M 232 214 Q 562 66 892 214" fill="none"/>
      </defs>

      <text font-family="Alfa Slab One" font-size="72" fill="#b8332a" letter-spacing="3">
        <textPath href="#connectArc" startOffset="50%" text-anchor="middle">LET'S CONNECT</textPath>
      </text>

      <g fill="#b8332a">
        <path transform="translate(196,104) scale(1.5)" d="M20 1 C21.6 12 28 18.4 39 20 C28 21.6 21.6 28 20 39 C18.4 28 12 21.6 1 20 C12 18.4 18.4 12 20 1 Z"/>
        <path transform="translate(890,96) scale(1.7)" d="M20 1 C21.6 12 28 18.4 39 20 C28 21.6 21.6 28 20 39 C18.4 28 12 21.6 1 20 C12 18.4 18.4 12 20 1 Z"/>
      </g>
    </svg>

    <div class="qr">
      <img src="../../assets/v2/qr_marshmallow_whitebg.png" alt="QR code linking to Sophia Reddehase&#39;s intake form">
    </div>
    <div class="qr-cap">FILL OUT MY FORM TO GET STARTED</div>

    <div class="details">
      (512) 676-1215<br>
      sophia.reddehase@spiritre.com<br>
      sparkapt.com/sophia-reddehase<br>
      Austin &amp; surrounding areas, TX
    </div>

    <div class="brokermark">
      <img src="../../assets/v2/spirit_logo_navy.png" alt="Spirit Real Estate Group, LLC">
      <span class="line">SOPHIA SKY REDDEHASE &nbsp;&#183;&nbsp; TREC #831516</span>
    </div>
  </div>
</body>
</html>
