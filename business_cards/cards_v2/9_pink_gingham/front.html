<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pink Gingham — Front</title>
<link rel="stylesheet" href="../../assets/fonts/fonts.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1125px;
    height: 675px;
    overflow: hidden;
    background: #e9b7bd;
  }

  .card {
    position: relative;
    width: 1125px;
    height: 675px;
    overflow: hidden;
    background: #f8f3ea;
    font-family: 'Poppins', sans-serif;
  }

  /* fine gingham check: 75px cells = exactly 15 x 9 */
  .checks {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(45deg, #e9b7bd 25%, transparent 25%, transparent 75%, #e9b7bd 75%),
      linear-gradient(45deg, #e9b7bd 25%, transparent 25%, transparent 75%, #e9b7bd 75%);
    background-size: 150px 150px;
    background-position: 0 0, 75px 75px;
  }

  .type {
    position: absolute;
    inset: 0;
  }

  .compliance {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    bottom: 58px;
    background: #f8f3ea;
    border-radius: 999px;
    padding: 9px 26px;
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    font-size: 14.5px;
    letter-spacing: 1.4px;
    color: #b8332a;
    white-space: nowrap;
  }

  /* Broker block. TREC 22 TAC 535.155(a)(2): broker name >= half the largest
     agent contact item on the face. Sizes here are checked by verify_trec.py. */
  .broker {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    bottom: 44px;
    background: #f8f3ea;
    border-radius: 22px;
    padding: 11px 32px 13px;
    text-align: center;
    white-space: nowrap;
  }
  .broker .eyebrow {
    display: block;
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 5px;
    color: #a8386b;
  }
  .broker .bname {
    display: block;
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 42px;
    line-height: 1.06;
    color: #b8332a;
    margin-top: 2px;
  }
  .broker .tline {
    display: block;
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    font-size: 16.5px;
    letter-spacing: 1.5px;
    color: #8f3128;
    margin-top: 5px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="checks"></div>

    <svg class="type" width="1125" height="675" viewBox="0 0 1125 675" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <path id="arcA" d="M 100 250 Q 562 154 1025 250" fill="none"/>
        <path id="arcB" d="M 118 386 Q 562 296 1007 386" fill="none"/>
      </defs>

      <!-- name on two gentle arcs, as on the reference -->
      <g font-family="Alfa Slab One" font-size="76" fill="#b8332a" letter-spacing="2">
        <text><textPath href="#arcA" startOffset="50%" text-anchor="middle">SOPHIA SKY</textPath></text>
        <text><textPath href="#arcB" startOffset="50%" text-anchor="middle">REDDEHASE</textPath></text>
      </g>

      <text x="562" y="466" text-anchor="middle"
            font-family="Poppins" font-weight="700" font-size="24" letter-spacing="8" fill="#b8332a">APARTMENT LOCATING &#183; AUSTIN, TX</text>

      <!-- little red stars, as on the reference -->
      <g fill="#b8332a">
        <path transform="translate(126,126) scale(1.5)" d="M20 1 C21.6 12 28 18.4 39 20 C28 21.6 21.6 28 20 39 C18.4 28 12 21.6 1 20 C12 18.4 18.4 12 20 1 Z"/>
        <path transform="translate(934,110) scale(1.9)" d="M20 1 C21.6 12 28 18.4 39 20 C28 21.6 21.6 28 20 39 C18.4 28 12 21.6 1 20 C12 18.4 18.4 12 20 1 Z"/>
        <path transform="translate(884,182) scale(1.0)" d="M20 1 C21.6 12 28 18.4 39 20 C28 21.6 21.6 28 20 39 C18.4 28 12 21.6 1 20 C12 18.4 18.4 12 20 1 Z"/>
      </g>
    </svg>

    <div class="broker">
      <span class="eyebrow">BROKERED BY</span>
      <span class="bname">Spirit Real Estate Group, LLC</span>
      <span class="tline">TREC #831516 &nbsp;&#183;&nbsp; SOPHIA SKY REDDEHASE, SALES AGENT</span>
    </div>
  </div>
</body>
</html>
